
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Church Ride Plan</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #102235;
      --muted: #667085;
      --line: #dfe7e4;
      --panel: #ffffff;
      --soft: #eef8f1;
      --green: #07984f;
      --green-dark: #067a43;
      --green-light: #dff4e7;
      --danger: #b42318;
      --shadow: 0 18px 45px rgba(16, 45, 32, 0.16);
      --app-width: min(100vw, 520px);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      background:
        radial-gradient(circle at 18% 12%, rgba(95, 194, 122, 0.18), transparent 32%),
        linear-gradient(135deg, #f6fbf4 0%, #eaf6ed 47%, #f7fbf8 100%);
    }

    body {
      min-height: 100%;
      margin: 0;
      color: var(--ink);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    a,
    input {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .page {
      min-height: 100dvh;
      margin: 0 auto;
      background: #fbfdfc;
    }

    .phone {
      width: var(--app-width);
      min-height: 100dvh;
      margin: 0 auto;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #fbfdfc;
    }

    .screen {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 18px 22px calc(86px + env(safe-area-inset-bottom));
      overflow: auto;
    }

    .secure-row,
    .top-row,
    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .secure-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--green);
      font-size: 13px;
      font-weight: 850;
    }

    .shield,
    .secure-mark {
      display: inline-grid;
      place-items: center;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      color: #fff;
      background: linear-gradient(160deg, #12b86a, #047f46);
      font-size: 14px;
      font-weight: 900;
    }

    .bell,
    .back-button,
    .icon-button {
      display: inline-grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border: 1px solid #e6ece9;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 8px 20px rgba(11, 23, 42, 0.08);
      color: var(--ink);
      cursor: pointer;
    }

    .back-button {
      border: 0;
      box-shadow: none;
      background: transparent;
      font-size: 34px;
    }

    .hero {
      display: grid;
      gap: 14px;
      padding-top: 8px;
    }

    .greeting {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .greeting small {
      display: block;
      color: var(--ink);
      font-size: 18px;
      line-height: 1.2;
    }

    h1 {
      margin: 0;
      font-size: 48px;
      line-height: 0.95;
      letter-spacing: 0;
      color: #102235;
    }

    h2 {
      margin: 0;
      font-size: 22px;
      line-height: 1.15;
      letter-spacing: 0;
    }

    h3 {
      margin: 0;
      font-size: 17px;
      line-height: 1.16;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.38;
    }

    .avatar {
      display: inline-grid;
      place-items: center;
      flex: 0 0 auto;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      color: #fff;
      background: linear-gradient(160deg, #1dbd69, #068345);
      border: 4px solid #e8f8ed;
      box-shadow: 0 7px 18px rgba(6, 122, 67, 0.24);
      font-size: 21px;
      font-weight: 900;
    }

    .avatar.small {
      width: 44px;
      height: 44px;
      border-width: 0;
      color: var(--green);
      background: var(--green-light);
      box-shadow: none;
      font-size: 17px;
    }

    .route-scene {
      height: 176px;
      position: relative;
      overflow: hidden;
      border-radius: 14px;
      border: 1px solid #edf1ef;
      background: #f8faf9;
      box-shadow: 0 14px 30px rgba(11, 23, 42, 0.08);
    }

    .route-image {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
      transform-origin: center;
    }

    .stack {
      display: grid;
      gap: 16px;
    }

    .summary-card,
    .driver-card,
    .rider-card,
    .detail-card,
    .map-panel,
    .empty-card {
      border: 1px solid #e3ebe8;
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 10px 24px rgba(11, 23, 42, 0.08);
    }

    .summary-card {
      display: grid;
      grid-template-columns: 56px 1fr auto;
      gap: 16px;
      align-items: center;
      padding: 18px;
    }

    .summary-icon {
      display: grid;
      place-items: center;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      color: var(--green);
      background: var(--green-light);
      font-size: 24px;
      font-weight: 900;
    }

    .count {
      display: block;
      margin-top: 3px;
      font-size: 38px;
      line-height: 1;
      color: #102235;
      font-weight: 900;
    }

    .primary-action,
    .secondary-action,
    .mark-button {
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
    }

    .primary-action {
      border: 0;
      color: #fff;
      background: linear-gradient(180deg, #12b96a, #07984f);
      box-shadow: 0 14px 24px rgba(7, 152, 79, 0.24);
    }

    .secondary-action,
    .mark-button {
      border: 1.5px solid #d1d9d6;
      color: #111827;
      background: #fff;
    }

    .mark-button {
      color: var(--green-dark);
      border-color: rgba(7, 152, 79, 0.45);
    }

    .mark-button.is-picked {
      color: #fff;
      background: var(--green);
      border-color: var(--green);
    }

    .driver-list,
    .riders-list {
      display: grid;
      gap: 12px;
    }

    .driver-card,
    .rider-card {
      width: 100%;
      min-height: 100px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 14px;
      align-items: center;
      padding: 14px;
      color: inherit;
      text-align: left;
      cursor: pointer;
    }

    .driver-card {
      border-color: rgba(6, 152, 80, 0.3);
      background: linear-gradient(135deg, #effaf3, #ffffff);
    }

    .driver-card strong,
    .rider-card strong {
      display: block;
      margin-bottom: 5px;
      font-size: 16px;
      line-height: 1.15;
    }

    .chevron {
      color: #102235;
      font-size: 30px;
      line-height: 1;
    }

    .stop-number {
      display: inline-grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      color: #fff;
      background: linear-gradient(160deg, #10ad61, #078246);
      font-size: 13px;
      font-weight: 900;
    }

    .rider-card {
      grid-template-columns: 30px 1fr auto;
      min-height: 112px;
      background: #fff;
    }

    .rider-address {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .rider-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .pill,
    .picked-chip {
      display: inline-flex;
      align-items: center;
      min-height: 23px;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 850;
    }

    .pill {
      color: var(--green-dark);
      background: var(--green-light);
    }

    .pill.gray {
      color: #344054;
      background: #eef2f0;
    }

    .picked-chip {
      display: none;
      color: var(--green-dark);
      background: var(--green-light);
    }

    .rider-card.is-picked .picked-chip {
      display: inline-flex;
    }

    .detail-top {
      display: grid;
      grid-template-columns: 42px 1fr 32px;
      align-items: center;
      gap: 10px;
    }

    .detail-top h2 {
      text-align: center;
    }

    .person-banner {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 14px;
      align-items: center;
      padding-top: 8px;
    }

    .person-banner h1 {
      font-size: 22px;
      line-height: 1.1;
    }

    .detail-card {
      padding: 6px 16px;
      box-shadow: 0 10px 24px rgba(11, 23, 42, 0.06);
    }

    .detail-row {
      display: grid;
      grid-template-columns: 30px 1fr;
      gap: 12px;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid #e6ece9;
    }

    .detail-row:last-child {
      border-bottom: 0;
    }

    .detail-icon {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      color: #344054;
      font-weight: 900;
    }

    .detail-row small {
      display: block;
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
    }

    .detail-row strong {
      display: block;
      color: #111827;
      font-size: 15px;
      line-height: 1.32;
      overflow-wrap: anywhere;
    }

    .map-panel {
      height: 170px;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.72), rgba(255, 255, 255, 0.38)),
        linear-gradient(35deg, transparent 0 12%, rgba(160, 198, 175, 0.28) 12% 27%, transparent 27% 100%),
        repeating-linear-gradient(35deg, #f3f6f4 0 3px, transparent 3px 42px),
        repeating-linear-gradient(125deg, #f0f4f2 0 3px, transparent 3px 46px);
    }

    .map-line {
      position: absolute;
      height: 7px;
      border-radius: 20px;
      background: var(--green);
      transform-origin: left center;
    }

    .map-line.one {
      width: 105px;
      left: 72px;
      bottom: 54px;
      transform: rotate(63deg);
    }

    .map-line.two {
      width: 150px;
      left: 139px;
      top: 92px;
      transform: rotate(-19deg);
    }

    .map-dot {
      position: absolute;
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      color: #fff;
      background: var(--green);
      box-shadow: 0 0 0 7px rgba(255, 255, 255, 0.84), 0 8px 18px rgba(7, 152, 79, 0.2);
      font-size: 18px;
      line-height: 1;
    }

    .map-dot.start { left: 55px; bottom: 58px; }
    .map-dot.end { right: 42px; top: 48px; }

    .map-label {
      position: absolute;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.9);
      color: #334155;
      font-size: 11px;
      font-weight: 850;
    }

    .start-label { left: 43px; bottom: 23px; }
    .end-label { right: 44px; top: 91px; }

    .map-logo {
      display: grid;
      place-items: center;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      color: #fff;
      font-size: 13px;
      font-weight: 900;
    }

    .map-logo.google {
      background: conic-gradient(from 40deg, #4285f4, #34a853, #fbbc04, #ea4335, #4285f4);
    }

    .map-logo.apple {
      background: conic-gradient(from 20deg, #5ac8fa, #34c759, #ffcc00, #ff3b30, #af52de, #5ac8fa);
    }

    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 0;
      z-index: 10;
      width: var(--app-width);
      transform: translateX(-50%);
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 4px;
      padding: 10px 42px calc(18px + env(safe-area-inset-bottom));
      border-top: 1px solid #e4ebe8;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
    }

    .nav-item {
      display: grid;
      place-items: center;
      gap: 4px;
      border: 0;
      background: transparent;
      color: #111827;
      font-size: 11px;
      font-weight: 750;
      cursor: pointer;
    }

    .nav-item.active {
      color: var(--green);
    }

    .nav-icon {
      display: grid;
      place-items: center;
      width: 28px;
      height: 24px;
      font-size: 20px;
      line-height: 1;
    }

    .empty-card {
      padding: 18px;
    }

    .error {
      color: var(--danger);
      font-weight: 800;
    }

    .modal {
      position: absolute;
      inset: 0;
      z-index: 12;
      display: none;
      place-items: end center;
      padding: 18px;
      background: rgba(16, 34, 53, 0.38);
    }

    .modal.open {
      display: grid;
    }

    .modal-card {
      width: 100%;
      display: grid;
      gap: 14px;
      padding: 18px;
      border-radius: 12px;
      border: 1px solid #dfe7e4;
      background: #fff;
      box-shadow: var(--shadow);
    }

    .modal-card input {
      width: 100%;
      height: 52px;
      padding: 0 14px;
      border: 1.5px solid #cfd8d4;
      border-radius: 8px;
      color: var(--ink);
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .primary-action:focus-visible,
    .secondary-action:focus-visible,
    .driver-card:focus-visible,
    .rider-card:focus-visible,
    .nav-item:focus-visible,
    .back-button:focus-visible,
    .icon-button:focus-visible,
    .mark-button:focus-visible,
    input:focus-visible {
      outline: 3px solid rgba(7, 152, 79, 0.34);
      outline-offset: 3px;
    }

    @media (max-width: 380px) {
      .screen {
        padding-inline: 16px;
      }

      h1 {
        font-size: 42px;
      }

      .bottom-nav {
        padding-inline: 34px;
      }
    }

    @media (min-width: 900px) {
      .page { background: #f5fbf7; }
    }

    :root {
      --ink: #050505;
      --muted: #6b7280;
      --line: #e6e7ea;
      --panel: #ffffff;
      --soft: #f4f4f5;
      --green: #000000;
      --green-dark: #000000;
      --green-light: #f1f1f3;
      --shadow: 0 14px 34px rgba(0, 0, 0, 0.08);
      --app-width: min(100vw, 430px);
    }

    html,
    body {
      background: #f7f7f8;
    }

    .page {
      min-height: 100dvh;
      background: #ffffff;
    }

    .phone {
      width: var(--app-width);
      min-height: 100dvh;
      background: #ffffff;
    }

    .screen {
      padding: 30px 28px calc(92px + env(safe-area-inset-bottom));
      background: #ffffff;
    }

    .screen.full-bottom {
      padding-bottom: calc(30px + env(safe-area-inset-bottom));
    }

    .stack {
      gap: 20px;
    }

    .intro-block {
      display: grid;
      gap: 7px;
    }

    .intro-block.compact {
      gap: 6px;
    }

    .intro-block h1 {
      margin: 0;
      color: #050505;
      font-size: 29px;
      line-height: 1.05;
      font-weight: 850;
      letter-spacing: 0;
    }

    .intro-block h2 {
      margin-top: 4px;
      color: #050505;
      font-size: 28px;
      line-height: 1.05;
      font-weight: 850;
      letter-spacing: 0;
    }

    .eyebrow {
      margin-top: 22px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .home-art {
      height: 188px;
      margin-top: 16px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 1px solid #eeeeee;
      border-radius: 16px;
      background: #fbfcfc;
      box-shadow: 0 16px 38px rgba(0, 0, 0, 0.08);
    }

    .home-art img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
    }

    .route-scene {
      height: 226px;
      margin-top: 14px;
      border: 0;
      border-radius: 16px;
      background: #f1f3f2;
      box-shadow: none;
    }

    .route-scene.compact {
      height: 180px;
      margin-top: 12px;
    }

    .summary-card,
    .driver-card,
    .rider-card,
    .detail-card,
    .empty-card,
    .passcode-card {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #ffffff;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.04);
    }

    .summary-card {
      display: block;
      padding: 22px;
    }

    .summary-card.dark {
      border: 0;
      color: #ffffff;
      background: #000000;
      box-shadow: none;
    }

    .summary-card.dark p {
      color: #d1d5db;
    }

    .summary-card.dark .count {
      color: #ffffff;
    }

    .summary-card.dark div {
      display: grid;
      grid-template-columns: auto 1fr;
      column-gap: 22px;
      align-items: end;
    }

    .summary-card.dark p:first-child {
      grid-column: 1 / -1;
    }

    .summary-card.dark p:last-child {
      padding-bottom: 4px;
      color: #ffffff;
      font-weight: 750;
    }

    .count {
      margin-top: 8px;
      color: #050505;
      font-size: 46px;
      font-weight: 850;
      line-height: 0.95;
    }

    .primary-action,
    .secondary-action,
    .mark-button {
      min-height: 60px;
      border-radius: 5px;
      font-size: 16px;
      font-weight: 750;
      box-shadow: none;
    }

    .primary-action {
      border: 0;
      color: #ffffff;
      background: #000000;
    }

    .secondary-action,
    .mark-button {
      border: 1px solid var(--line);
      color: #050505;
      background: #ffffff;
    }

    .mark-button {
      border-color: #cfd4d2;
    }

    .mark-button.is-picked {
      color: #ffffff;
      background: #000000;
      border-color: #000000;
    }

    .destination-block {
      display: grid;
      gap: 5px;
      padding: 8px 20px 16px;
    }

    .destination-block h2 {
      color: #050505;
      font-size: 26px;
      font-weight: 850;
    }

    .passcode-card {
      padding: 17px 20px;
      background: #f4f4f4;
      border: 0;
      box-shadow: none;
    }

    .passcode-card strong {
      display: block;
      margin-top: 6px;
      color: #050505;
      font-size: 17px;
    }

    .driver-list,
    .riders-list,
    .route-list {
      display: grid;
      gap: 12px;
    }

    .profile-header {
      padding-top: 44px;
    }

    .profile-header h1 {
      font-size: 38px;
      line-height: 1.02;
    }

    .profile-header > p:last-child {
      color: var(--muted);
      font-size: 18px;
      font-weight: 500;
    }

    .profile-header .eyebrow {
      margin-top: 0;
      font-size: 17px;
      font-weight: 800;
    }

    .driver-card {
      position: relative;
      min-height: 126px;
      grid-template-columns: 68px minmax(0, 1fr);
      grid-template-rows: auto auto;
      gap: 14px;
      row-gap: 9px;
      padding: 16px 14px 15px;
      border-color: #dfe3e6;
      background: #ffffff;
    }

    .driver-card .avatar.small {
      grid-row: 1 / 3;
      width: 58px;
      height: 58px;
      color: #ffffff;
      background: #000000;
      border: 0;
      box-shadow: none;
      font-size: 24px;
    }

    .driver-card strong {
      color: #050505;
      font-size: 21px;
      font-weight: 850;
    }

    .route-stop strong {
      color: #050505;
      font-size: 17px;
      font-weight: 800;
    }

    .driver-card p {
      max-width: none;
      font-size: 14px;
    }

    .driver-copy {
      display: grid;
      grid-column: 2;
      grid-row: 1;
      gap: 7px;
      min-width: 0;
    }

    .driver-copy strong {
      margin-bottom: 0;
    }

    .driver-details {
      display: grid;
      grid-column: 2;
      grid-row: 2;
      gap: 7px;
      min-width: 0;
    }

    .driver-route-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      color: #111827;
      font-size: 15px;
      line-height: 1.22;
      font-weight: 500;
    }

    .driver-route-row span:last-child {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .driver-meta-icon {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      color: #000000;
    }

    .driver-action-group {
      position: absolute;
      top: 23px;
      right: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .driver-chevron {
      color: #6b7280;
      font-size: 30px;
      font-weight: 350;
      line-height: 1;
    }

    .profile-destination-card {
      min-height: 82px;
      display: grid;

<body>
  <main class="page">
    <article class="phone" aria-live="polite">
      <div id="screen" class="screen"></div>

      <nav class="bottom-nav" aria-label="Main navigation">
        <button id="homeNav" class="nav-item active" type="button">
          <span class="nav-icon home-icon" aria-hidden="true">
            <svg class="home-outline" viewBox="0 0 28 28" focusable="false">
              <path d="M5 12.5 14 4l9 8.5v10.2h-6.2v-7h-5.6v7H5V12.5Z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
            </svg>
            <svg class="home-fill" viewBox="0 0 28 28" focusable="false">
              <path d="M5 12.5 14 4l9 8.5v10.2h-6.2v-7h-5.6v7H5V12.5Z" fill="currentColor"/>
            </svg>
          </span>
          <span>Home</span>
        </button>
        <button id="profileNav" class="nav-item" type="button">
          <span class="nav-icon profile-icon" aria-hidden="true">
            <svg viewBox="0 0 28 28" focusable="false">
              <circle cx="14" cy="9" r="4.2" fill="none" stroke="currentColor" stroke-width="2"/>
              <path d="M5.5 24c1.6-5.1 5-7.7 8.5-7.7S20.9 18.9 22.5 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </span>
          <span>My Profile</span>
        </button>
      </nav>

      <div id="codeModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <form id="codeForm" class="modal-card">
          <div>
            <h2 id="modalTitle">Passcode</h2>
            <p id="modalDriver"></p>
          </div>
          <input id="driverCode" type="password" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" aria-label="Passcode">
          <p id="codeError" class="error" hidden></p>
          <div class="modal-actions">
            <button class="secondary-action" type="button" id="cancelCode">Cancel</button>
            <button class="primary-action" type="submit" id="codeSubmit">Open route</button>
          </div>
        </form>
      </div>
    </article>
  </main>

  <script>
    const SUPABASE_URL = "https://cpkimtrribpvqxbywfry.supabase.co";
    const SUPABASE_KEY = "sb_publishable_qegP80qyqPq3qjqm6J3DIg_M4eNbRaZ";
    const PLAN_DATE = "2026-08-02";

    const state = {
      view: "home",
      drivers: [],
      selectedDriver: null,
      route: null,
      selectedRider: null,
      codeMode: "driver",
      adminCode: "",
      admin: null,
      adminDraftStops: [],
      adminDeletedStopIds: [],
      adminSelectedStopId: null,
      adminActiveTab: "routes",
      adminSearch: "",
      adminMessage: "",
      adminError: "",
      adminLoading: false,
      loading: true,
      error: "",
    };

    const screen = document.querySelector("#screen");
    const homeNav = document.querySelector("#homeNav");
    const profileNav = document.querySelector("#profileNav");
    const bottomNav = document.querySelector(".bottom-nav");
    const codeModal = document.querySelector("#codeModal");
    const codeForm = document.querySelector("#codeForm");
    const driverCode = document.querySelector("#driverCode");
    const modalDriver = document.querySelector("#modalDriver");
    const codeError = document.querySelector("#codeError");
    const codeSubmit = document.querySelector("#codeSubmit");

    const escapeHtml = (value) => String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#39;");

    const encodeAddress = (address) => encodeURIComponent(address || "");
    const googleMaps = (address) => "https://www.google.com/maps/search/?api=1&query=" + encodeAddress(address);
    const appleMaps = (address) => "https://maps.apple.com/?q=" + encodeAddress(address);
    const telHref = (phone) => {
      const digits = String(phone || "").replace(/\D/g, "");
      if (!digits) return "";
      return "tel:+" + (digits.length === 10 ? "1" + digits : digits);
    };

    async function rpc(name, body) {
      const response = await fetch(SUPABASE_URL + "/rest/v1/rpc/" + name, {
        method: "POST",
        headers: {
          "apikey": SUPABASE_KEY,
          "authorization": "Bearer " + SUPABASE_KEY,
          "content-type": "application/json",
        },
        body: JSON.stringify(body),
      });

      if (!response.ok) {
        const message = await response.text();
        throw new Error(message || "Supabase request failed");
      }

      return response.json();
    }

    async function loadDrivers() {
      state.loading = true;
      state.error = "";
      render();

      try {
        state.drivers = await rpc("ride_driver_directory", { p_plan_date: PLAN_DATE });
      } catch (error) {
        state.error = "Could not load drivers.";
        console.error(error);
      } finally {
        state.loading = false;
        render();
      }
    }

    const ROUTE_IMAGES = {
      "joojo": { src: "assets/route-map-1.png", position: "center 50%", scale: "1.02" },
      "john-mark": { src: "assets/route-map-2.png", position: "center 50%", scale: "1.02" },
      "annie": { src: "assets/route-map-3.png", position: "center 50%", scale: "1.02" },
      "dawson": { src: "assets/route-map-1.png", position: "center 38%", scale: "1.10" },
      "naa": { src: "assets/route-map-2.png", position: "center 62%", scale: "1.09" },
      "blue": { src: "assets/route-map-3.png", position: "center 36%", scale: "1.08" },
      "default": { src: "assets/route-map-1.png", position: "center 50%", scale: "1.02" },
    };

    const DESTINATION_SUMMARY = {
      label: "University of Houston Hilton Hotel",
      address: "4450 University Drive, Houston, TX 77204",
    };

    const DRIVER_ROUTE_SUMMARIES = {
      "joojo": {
        routeLabel: "West / North Houston Route",
        timeLabel: "1 hr 22 min to UH Hilton",
      },
      "john-mark": {
        routeLabel: "Huntsville Route",
      },
      "annie": {
        routeLabel: "Southwest Houston Route",
        timeLabel: "35 min to UH Hilton",
      },
      "dawson": {
        routeLabel: "Neighborhood Route",
        startLabel: "Starts 11:52 AM",
        timeLabel: "38 min to UH Hilton",
      },
      "naa": {
        routeLabel: "No pickups assigned",
      },
      "blue": {
        routeLabel: "Southeast Houston Route",
        timeLabel: "1 hr 5 min to UH Hilton",
      },
    };

    function routeScene(driverSlug = "default", variant = "dashboard") {
      const routeImage = ROUTE_IMAGES[driverSlug] || ROUTE_IMAGES.default;
      const compactClass = variant === "review" ? " compact" : "";
      return `
        <div class="route-scene${compactClass}" aria-hidden="true">
          <img class="route-image" src="${routeImage.src}" style="object-position: ${routeImage.position}; transform: scale(${routeImage.scale});" alt="">
        </div>`;
    }

    function homeArt() {
      return `
        <div class="home-art" aria-hidden="true">
          <img src="assets/home-car.png" alt="">
        </div>`;
    }

    function countRiders() {
      return state.drivers.reduce((sum, driver) => sum + Number(driver.pickup_count || 0), 0);
    }

    function pickupCountLabel(count) {
      const total = Number(count || 0);
      return `${total} Pickup${total === 1 ? "" : "s"}`;
    }

    function routeTimeLabel(summary) {
      if (!summary?.timeLabel) return "";
      return summary.startLabel ? `${summary.startLabel} · ${summary.timeLabel}` : summary.timeLabel;
    }

    function driverRouteSummary(driver) {
      return DRIVER_ROUTE_SUMMARIES[driver.slug] || {
        routeLabel: driver.subtitle || "Assigned Route",
        timeLabel: "Route time pending",
      };
    }

    function iconSvg(name) {
      const icons = {
        pin: `<svg class="driver-meta-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 21s6-5.25 6-11a6 6 0 0 0-12 0c0 5.75 6 11 6 11Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="10" r="2.25" stroke="currentColor" stroke-width="2"/></svg>`,
        clock: `<svg class="driver-meta-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3 2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
        car: `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m5 12 1.5-4.5A2 2 0 0 1 8.4 6h7.2a2 2 0 0 1 1.9 1.5L19 12" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M4 12h16v6H4v-6Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M7 18v2M17 18v2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="7.5" cy="15" r="1" fill="currentColor"/><circle cx="16.5" cy="15" r="1" fill="currentColor"/></svg>`,
        map: `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m9 18-6 3V6l6-3m0 15 6 3m-6-3V3m6 18 6-3V3l-6 3m0 15V6m0 0L9 3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
      };
      return icons[name] || "";
    }

    function driverProfileCard(driver) {
      const summary = driverRouteSummary(driver);
      const timeLabel = routeTimeLabel(summary);
      return `
        <button class="driver-card" type="button" data-driver="${escapeHtml(driver.slug)}" aria-label="Open ${escapeHtml(driver.display_name)} profile">
          <span class="avatar small">${escapeHtml(driver.initials)}</span>
          <span class="driver-copy">
            <strong>${escapeHtml(driver.display_name)}</strong>
          </span>
          <span class="driver-action-group">

    function cloneStops(stops = []) {
      return stops.map((stop) => ({ ...stop }));
    }

    function adminDrivers() {
      return state.admin?.drivers || [];
    }

    function adminStops() {
      return state.adminDraftStops || [];
    }

    function adminStopsForDriver(slug) {
      return adminStops()
        .filter((stop) => stop.driverSlug === slug)
        .sort((a, b) => Number(a.stopOrder || 0) - Number(b.stopOrder || 0) || a.name.localeCompare(b.name));
    }

    function adminDriverBySlug(slug) {
      return adminDrivers().find((driver) => driver.slug === slug);
    }

    function adminDriverName(slug) {
      return adminDriverBySlug(slug)?.displayName || slug || "Unassigned";
    }

    function adminOriginalStopMap() {
      return new Map((state.admin?.stops || []).map((stop) => [stop.id, stop]));
    }

    function adminComparableStop(stop) {
      return {
        id: String(stop.id || ""),
        driverSlug: stop.driverSlug || "",
        stopOrder: Number(stop.stopOrder || 0),
        name: stop.name || "",
        phone: stop.phone || "",
        address: stop.address || "",
        area: stop.area || "",
        pickupTime: stop.pickupTime || "",
        readyBy: stop.readyBy || "",
        routeLabel: stop.routeLabel || "",
        notes: stop.notes || "",
      };
    }

    function adminChangedCount() {
      return adminChangeList().length;
    }

    function adminChangeList() {
      const original = adminOriginalStopMap();
      const changes = [];

      state.adminDeletedStopIds.forEach((stopId) => {
        const before = original.get(stopId);
        changes.push({
          symbol: "-",
          title: `Removed ${before?.name || "rider"} from ${adminDriverName(before?.driverSlug)}`,
          detail: before?.address || "This rider will be removed from the published plan.",
        });
      });

      adminStops().forEach((stop) => {
        const stopId = String(stop.id || "");
        const before = original.get(stop.id);

        if (stopId.startsWith("temp-") || !before) {
          changes.push({
            symbol: "+",
            title: `Added ${stop.name} to ${adminDriverName(stop.driverSlug)}`,
            detail: stop.address || "New rider needs an address before publishing.",
          });
          return;
        }

        const beforeComparable = adminComparableStop(before);
        const afterComparable = adminComparableStop(stop);
        if (JSON.stringify(beforeComparable) === JSON.stringify(afterComparable)) return;

        const details = [];
        if (before.driverSlug !== stop.driverSlug) {
          details.push(`${adminDriverName(before.driverSlug)} to ${adminDriverName(stop.driverSlug)}`);
        }
        if (before.name !== stop.name) details.push(`Name changed from ${before.name}`);
        if (before.address !== stop.address) details.push("Address updated");
        if (before.phone !== stop.phone) details.push("Phone updated");
        if (before.pickupTime !== stop.pickupTime || before.readyBy !== stop.readyBy) details.push("Pickup time updated");
        if (Number(before.stopOrder || 0) !== Number(stop.stopOrder || 0)) details.push("Stop order updated");
        if (before.area !== stop.area) details.push("Area updated");
        if (before.routeLabel !== stop.routeLabel) details.push("Route label updated");
        if (before.notes !== stop.notes) details.push("Notes updated");

        changes.push({
          symbol: before.driverSlug !== stop.driverSlug ? ">" : "*",
          title: before.driverSlug !== stop.driverSlug
            ? `${stop.name} moved from ${adminDriverName(before.driverSlug)} to ${adminDriverName(stop.driverSlug)}`
            : `${stop.name} details updated`,
          detail: details.join(" · ") || "Rider details changed.",
        });
      });

      return changes;
    }

    function adminSearchText(stop) {
      return [
        stop.name,
        stop.phone,
        stop.address,
        stop.area,
        stop.pickupTime,
        stop.readyBy,
        stop.routeLabel,
        adminDriverName(stop.driverSlug),
      ].filter(Boolean).join(" ").toLowerCase();
    }

    function adminFilteredStops() {
      const query = String(state.adminSearch || "").trim().toLowerCase();
      const stops = adminStops()
        .slice()
        .sort((a, b) => adminDriverName(a.driverSlug).localeCompare(adminDriverName(b.driverSlug)) || Number(a.stopOrder || 0) - Number(b.stopOrder || 0) || a.name.localeCompare(b.name));

      if (!query) return stops;
      return stops.filter((stop) => adminSearchText(stop).includes(query));
    }

    function normalizeAdminDraftStops() {
      const byDriver = new Map();
      adminStops().forEach((stop) => {
        const list = byDriver.get(stop.driverSlug) || [];
        list.push(stop);
        byDriver.set(stop.driverSlug, list);
      });

      byDriver.forEach((list) => {
        list
          .sort((a, b) => Number(a.stopOrder || 0) - Number(b.stopOrder || 0) || a.name.localeCompare(b.name))
          .forEach((stop, index) => {
            stop.stopOrder = index + 1;
          });
      });
    }

    function adminDriverOptionList(selectedSlug) {
      return adminDrivers().map((driver) => `
        <option value="${escapeHtml(driver.slug)}" ${driver.slug === selectedSlug ? "selected" : ""}>${escapeHtml(driver.displayName)}</option>
      `).join("");
    }

    function openAdminEditor(stopId = "new") {
      state.adminSelectedStopId = stopId;
      state.adminError = "";
      state.adminMessage = "";
      state.view = "adminEdit";
      render();
    }

    function adminSelectedStop() {
      if (state.adminSelectedStopId === "new") {
        return {
          id: "",
          driverSlug: adminDrivers()[0]?.slug || "",
          stopOrder: 1,
          name: "",
          phone: "",
          address: "",
          area: "",
          pickupTime: "",
          readyBy: "",
          routeLabel: "",
          notes: "",
        };
      }

      return adminStops().find((stop) => stop.id === state.adminSelectedStopId);
    }

    function saveAdminDraftFromForm(form) {
      const formData = new FormData(form);
      const stop = {
        id: formData.get("id") || `temp-${Date.now()}`,
        driverSlug: String(formData.get("driverSlug") || ""),
        stopOrder: Number(formData.get("stopOrder") || 1),
        name: String(formData.get("name") || "").trim(),
        phone: String(formData.get("phone") || "").trim(),
        address: String(formData.get("address") || "").trim(),
        area: String(formData.get("area") || "").trim(),
        pickupTime: String(formData.get("pickupTime") || "").trim(),
        readyBy: String(formData.get("readyBy") || "").trim(),
        routeLabel: String(formData.get("routeLabel") || "").trim(),
        notes: String(formData.get("notes") || "").trim(),
      };

      if (!stop.name || !stop.address || !stop.driverSlug) {
        state.adminError = "Name, address, and driver are required.";
        render();
        return;
      }

      const index = state.adminDraftStops.findIndex((item) => item.id === stop.id);
      if (index >= 0) state.adminDraftStops[index] = stop;
      else state.adminDraftStops.push(stop);

      normalizeAdminDraftStops();
      state.adminSelectedStopId = null;
      state.adminMessage = `${stop.name} is ready to publish.`;
      state.adminError = "";
      state.adminActiveTab = "changes";
      state.view = "admin";
      render();
    }

    function deleteAdminDraftStop(stopId) {
      const stop = adminStops().find((item) => item.id === stopId);
      if (!stop) return;

      state.adminDraftStops = adminStops().filter((item) => item.id !== stopId);
      if (!String(stopId).startsWith("temp-")) {
        state.adminDeletedStopIds.push(stopId);
      }
      normalizeAdminDraftStops();
      state.adminMessage = `${stop.name} will be removed when you publish.`;
      state.adminError = "";
      state.adminActiveTab = "changes";
      render();
    }

    async function loadAdminSnapshot(adminCode = state.adminCode) {
      state.adminLoading = true;
      state.adminError = "";
      render();

      try {
        const snapshot = await rpc("ride_admin_snapshot", {
          p_admin_code: adminCode,
          p_plan_date: PLAN_DATE,
        });

        if (!snapshot?.ok) {
          throw new Error(snapshot?.error || "invalid_admin_code");
        }

        state.adminCode = adminCode;
        state.admin = snapshot;
        state.adminDraftStops = cloneStops(snapshot.stops);
        state.adminDeletedStopIds = [];
        state.adminSelectedStopId = null;
        state.adminActiveTab = "routes";
        state.adminSearch = "";
        state.adminMessage = "";
        state.view = "admin";
        closeCodeModal();
      } catch (error) {
        state.adminError = error.message === "invalid_admin_code" ? "Admin code did not match." : "Admin could not open.";
        if (state.codeMode === "admin" && codeModal.classList.contains("open")) {
          codeError.textContent = state.adminError;
          codeError.hidden = false;
        }
        console.error(error);
      } finally {
        state.adminLoading = false;
        render();
      }
    }

    async function publishAdminDraft() {
      if (!state.adminCode) return;
      state.adminLoading = true;
      state.adminError = "";
      render();

      try {
        const published = await rpc("ride_admin_publish_plan", {
          p_admin_code: state.adminCode,
          p_plan_date: PLAN_DATE,
          p_stops: adminStops().map((stop) => ({
            ...stop,
            id: String(stop.id || "").startsWith("temp-") ? null : stop.id,
          })),
          p_deleted_stop_ids: state.adminDeletedStopIds,
        });

        if (!published?.ok) {
          throw new Error(published?.error || "publish_failed");
        }

        state.admin = published;
        state.adminDraftStops = cloneStops(published.stops);
        state.adminDeletedStopIds = [];
        state.adminSelectedStopId = null;
        state.adminActiveTab = "routes";
        state.adminSearch = "";
        state.adminMessage = "Route changes published.";
        state.drivers = await rpc("ride_driver_directory", { p_plan_date: PLAN_DATE });
      } catch (error) {
        state.adminError = "Could not publish changes.";
        console.error(error);
      } finally {
        state.adminLoading = false;
        render();
      }
    }

          </section>

          <section class="destination-block">
            <p>Destination</p>
            <h2>${escapeHtml(destination.label)}</h2>
            <p>${escapeHtml(destination.address)}</p>
          </section>

          <button class="primary-action" type="button" data-action="rides">View my rides <span aria-hidden="true">&rarr;</span></button>
        </div>`;
    }

    function readyText(rider) {
      return rider.readyBy ? `Ready by ${rider.readyBy}` : "Coordinate pickup directly";
    }

    function pickupTimeText(rider) {
      return rider.pickupTime || "";
    }

    function routeStopRow(rider) {
      return `
        <button class="route-stop" type="button" data-rider="${Number(rider.stopOrder)}" aria-label="Open ${escapeHtml(rider.name)} pickup details">
          <span class="stop-number">${Number(rider.stopOrder)}</span>
          <span class="stop-copy">
            <strong>${escapeHtml(rider.name)}</strong>
            <span>${escapeHtml(rider.address)}</span>
            <small>${escapeHtml(readyText(rider))}</small>
          </span>
          <span class="stop-time">${escapeHtml(pickupTimeText(rider))}</span>
        </button>`;
    }

    function routeTarget(riders, destination) {
      const nextRider = riders.find((rider) => !getPicked(rider.stopOrder));
      if (nextRider) {
        return {
          address: nextRider.address,
          label: `Start route to ${nextRider.name}`,
          allPicked: false,
        };
      }

      return {
        address: destination.address,
        label: `Start route to ${destination.label}`,
        allPicked: true,
      };
    }

    function ridesView() {
      const driver = state.route?.driver;
      const riders = state.route?.riders || [];
      const destination = state.route?.destination;
      const target = routeTarget(riders, destination);

      const cards = riders.map(routeStopRow).join("");

      return `
        <div class="stack">
          <section class="intro-block compact">
            <div class="title-row">
              <button class="back-button" type="button" data-action="driverHome" aria-label="Back">&larr;</button>
              <div>
                <h1>Review route</h1>
                <p>${escapeHtml(driver.displayName)}'s pickups</p>
              </div>
            </div>
            ${routeScene(driver.slug, "review")}
          </section>

          <section class="route-list" aria-label="Assigned riders">
            <h2>Pick-up</h2>
            ${cards}
          </section>

          <section class="route-list" aria-label="Drop off">
            <h2>Drop-off</h2>
            <div class="route-stop destination ${target.allPicked ? "is-picked" : ""}">
              <span class="stop-number">✓</span>
              <span class="stop-copy">
                <strong>${escapeHtml(destination.label)}</strong>
                <span>${escapeHtml(destination.address)}</span>
                <small>${target.allPicked ? "Ready for final route" : "Final destination"}</small>
              </span>
            </div>
          </section>

          <a class="primary-action route-start" href="${googleMaps(target.address)}" target="_blank" rel="noreferrer">${escapeHtml(target.label)} <span aria-hidden="true">&rarr;</span></a>
        </div>`;
    }

    function detailRows(rider) {
      return [
        `<div class="detail-row"><small>Address</small><strong>${escapeHtml(rider.address)}</strong></div>`,
        rider.phone ? `<div class="detail-row"><small>Phone</small><strong>${escapeHtml(rider.phone)}</strong></div>` : "",
        rider.routeLabel ? `<div class="detail-row"><small>Route</small><strong>${escapeHtml(rider.routeLabel)}</strong></div>` : "",
        rider.pickupTime ? `<div class="detail-row"><small>Pickup time</small><strong>${escapeHtml(rider.pickupTime)}</strong></div>` : "",
        rider.readyBy ? `<div class="detail-row"><small>Ready by</small><strong>${escapeHtml(rider.readyBy)}</strong></div>` : "",
        `<div class="detail-row"><small>Notes</small><strong>${escapeHtml(rider.notes || "Coordinate pickup directly.")}</strong></div>`,
      ].join("");
    }

    function detailView() {
      const rider = state.selectedRider;
      const driver = state.route?.driver;
      const picked = getPicked(rider.stopOrder);
      const phoneLink = telHref(rider.phone);

      return `
        <div class="stack">
          <section class="intro-block compact">
            <div class="title-row">
              <button class="back-button" type="button" data-action="rides" aria-label="Back">&larr;</button>
              <div>
                <h1>Pickup details</h1>
                <p>${escapeHtml(rider.area)}</p>
              </div>
            </div>
            ${routeScene(driver.slug, "review")}
          </section>

          <section class="person-banner">
            <span class="avatar small">${escapeHtml(rider.name.slice(0, 1))}</span>
            <div>
              <h2>${escapeHtml(rider.name)}</h2>
              <p>${escapeHtml(rider.address)}</p>
            </div>
            <span class="stop-number">${Number(rider.stopOrder)}</span>
          </section>
          <section class="detail-card">
            ${detailRows(rider)}
          </section>

          <a class="primary-action" href="${googleMaps(rider.address)}" target="_blank" rel="noreferrer">
            <span>Open in Google Maps</span>
          </a>
          <a class="secondary-action" href="${appleMaps(rider.address)}" target="_blank" rel="noreferrer">
            <span>Open in Apple Maps</span>
          </a>
          ${phoneLink ? `<a class="secondary-action" href="${phoneLink}">Call rider</a>` : ""}
          <button class="mark-button ${picked ? "is-picked" : ""}" type="button" data-mark="${Number(rider.stopOrder)}">
            <span>✓</span>
            <span>${picked ? "Picked up" : "Mark picked up"}</span>
          </button>
        </div>`;
    }

    function getStorageKey(stopOrder) {
      const driver = state.route?.driver?.slug || "driver";
      return "ride-picked-" + PLAN_DATE + "-" + driver + "-" + stopOrder;
    }

    function getPicked(stopOrder) {
      return localStorage.getItem(getStorageKey(stopOrder)) === "1";
    }

    function setPicked(stopOrder, value) {
      localStorage.setItem(getStorageKey(stopOrder), value ? "1" : "0");
      render();
    }

    function markPickedAndReturn(stopOrder) {
      localStorage.setItem(getStorageKey(stopOrder), !getPicked(stopOrder) ? "1" : "0");
      state.selectedRider = null;
      state.view = "rides";
      render();
    }

    function render() {
      setActiveNav();
      if (state.view === "profile") screen.innerHTML = profileView();
      else if (state.view === "driverHome" && state.route) screen.innerHTML = driverHomeView();
      else if (state.view === "rides" && state.route) screen.innerHTML = ridesView();
      else if (state.view === "detail" && state.selectedRider) screen.innerHTML = detailView();
      else if (state.view === "admin") screen.innerHTML = adminView();
      else if (state.view === "adminEdit") screen.innerHTML = adminEditView();
      else screen.innerHTML = homeView();
      syncPickedChips();
    }

    function syncPickedChips() {
      document.querySelectorAll(".rider-card[data-rider], .route-stop[data-rider]").forEach((card) => {
        const stopOrder = card.dataset.rider;
        card.classList.toggle("is-picked", getPicked(stopOrder));
      });
    }

    async function openCodeModal(slug) {
      state.codeMode = "driver";
      state.selectedDriver = state.drivers.find((driver) => driver.slug === slug);
      document.querySelector("#modalTitle").textContent = "Passcode";
      modalDriver.textContent = state.selectedDriver?.display_name || "";
      codeSubmit.textContent = "Open route";
      codeError.hidden = true;
      codeError.textContent = "";
      driverCode.value = "";
      codeModal.classList.add("open");
    }

    function openAdminCodeModal() {
      state.codeMode = "admin";
      state.selectedDriver = null;
      document.querySelector("#modalTitle").textContent = "Admin passcode";
      modalDriver.textContent = "Ride Control";
      codeSubmit.textContent = "Open admin";
      codeError.hidden = true;
      codeError.textContent = "";
      driverCode.value = "";
      codeModal.classList.add("open");
    }

    function closeCodeModal() {
      codeModal.classList.remove("open");
      codeError.hidden = true;
      codeError.textContent = "";
    }

    async function submitCode(event) {
      event.preventDefault();
      if (state.codeMode === "admin") {
        await loadAdminSnapshot(driverCode.value);
        return;
      }

      if (!state.selectedDriver) return;
      codeError.hidden = true;
      codeError.textContent = "";

      try {
        const route = await rpc("ride_driver_route", {
          p_driver_slug: state.selectedDriver.slug,
          p_access_code: driverCode.value,
          p_plan_date: PLAN_DATE,
        });

        if (!route?.ok) {
          codeError.textContent = "Code did not match.";
          codeError.hidden = false;
          return;
        }

        state.route = route;
        closeCodeModal();
        setDriverHome();
      } catch (error) {
        codeError.textContent = "Route could not open.";
        codeError.hidden = false;
        console.error(error);
      }
    }

    screen.addEventListener("click", (event) => {
      const adminTabButton = event.target.closest("[data-admin-tab]");
      if (adminTabButton) {
        state.adminActiveTab = adminTabButton.dataset.adminTab;
        render();
        return;
      }

      const action = event.target.closest("[data-action]")?.dataset.action;
      if (action === "home") openHome();
      if (action === "profile") openProfile();
      if (action === "driverHome") setDriverHome();
      if (action === "rides") setRidesView();
      if (action === "admin") openAdminCodeModal();
      if (action === "adminBack") {
        state.adminError = "";
        state.adminSelectedStopId = null;
        state.view = "admin";
        render();
      }
      if (action === "adminNew") openAdminEditor("new");
      if (action === "adminPublish") publishAdminDraft();

      const adminEditButton = event.target.closest("[data-admin-edit]");
      if (adminEditButton) openAdminEditor(adminEditButton.dataset.adminEdit);

      const adminDeleteButton = event.target.closest("[data-admin-delete]");
      if (adminDeleteButton) {
        const stopId = adminDeleteButton.dataset.adminDelete;
        const stop = adminStops().find((item) => item.id === stopId);
        if (stop && confirm(`Remove ${stop.name} from the ride plan?`)) {
          deleteAdminDraftStop(stopId);
        }
      }

      const driverButton = event.target.closest("[data-driver]");
      if (driverButton) openCodeModal(driverButton.dataset.driver);

      const riderButton = event.target.closest("[data-rider]");
      if (riderButton) {
        const stopOrder = Number(riderButton.dataset.rider);
        state.selectedRider = (state.route?.riders || []).find((rider) => Number(rider.stopOrder) === stopOrder);
        if (state.selectedRider) {
          state.view = "detail";
          render();
        }
      }

      const markButton = event.target.closest("[data-mark]");
      if (markButton) {
        const stopOrder = markButton.dataset.mark;
        markPickedAndReturn(stopOrder);
      }
    });

    screen.addEventListener("input", (event) => {
      const searchInput = event.target.closest("[data-admin-search]");
      if (!searchInput) return;

      state.adminSearch = searchInput.value;
      const results = screen.querySelector("[data-admin-riders-results]");
      if (results) results.innerHTML = adminRidersResultsHtml();
    });

    screen.addEventListener("submit", (event) => {
      const adminForm = event.target.closest("[data-admin-form='rider']");
      if (!adminForm) return;
      event.preventDefault();
      saveAdminDraftFromForm(adminForm);
    });

    homeNav.addEventListener("click", () => {
      if (state.route) setDriverHome();
      else openHome();
    });
    profileNav.addEventListener("click", openProfile);
    codeForm.addEventListener("submit", submitCode);
    document.querySelector("#cancelCode").addEventListener("click", closeCodeModal);
    codeModal.addEventListener("click", (event) => {
      if (event.target === codeModal) closeCodeModal();
    });

    loadDrivers();
  </script>
</body>
</html>
