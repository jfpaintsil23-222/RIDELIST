
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Church Ride Plan</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #102235;
      --muted: #667085;
      --line: #dfe7e4;
      --panel: #ffffff;
      --soft: #eef8f1;
      --green: #07984f;
      --green-dark: #067a43;
      --green-light: #dff4e7;
      --danger: #b42318;
      --shadow: 0 18px 45px rgba(16, 45, 32, 0.16);
      --app-width: min(100vw, 520px);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      background:
        radial-gradient(circle at 18% 12%, rgba(95, 194, 122, 0.18), transparent 32%),
        linear-gradient(135deg, #f6fbf4 0%, #eaf6ed 47%, #f7fbf8 100%);
    }

    body {
      min-height: 100%;
      margin: 0;
      color: var(--ink);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    a,
    input {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .page {
      min-height: 100dvh;
      margin: 0 auto;
      background: #fbfdfc;
    }

    .phone {
      width: var(--app-width);
      min-height: 100dvh;
      margin: 0 auto;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #fbfdfc;
    }

    .screen {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 18px 22px calc(86px + env(safe-area-inset-bottom));
      overflow: auto;
    }

    .secure-row,
    .top-row,
    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .secure-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--green);
      font-size: 13px;
      font-weight: 850;
    }

    .shield,
    .secure-mark {
      display: inline-grid;
      place-items: center;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      color: #fff;
      background: linear-gradient(160deg, #12b86a, #047f46);
      font-size: 14px;
      font-weight: 900;
    }

    .bell,
    .back-button,
    .icon-button {
      display: inline-grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border: 1px solid #e6ece9;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 8px 20px rgba(11, 23, 42, 0.08);
      color: var(--ink);
      cursor: pointer;
    }

    .back-button {
      border: 0;
      box-shadow: none;
      background: transparent;
      font-size: 34px;
    }

    .hero {
      display: grid;
      gap: 14px;
      padding-top: 8px;
    }

    .greeting {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .greeting small {
      display: block;
      color: var(--ink);
      font-size: 18px;
      line-height: 1.2;
    }

    h1 {
      margin: 0;
      font-size: 48px;
      line-height: 0.95;
      letter-spacing: 0;
      color: #102235;
    }

    h2 {
      margin: 0;
      font-size: 22px;
      line-height: 1.15;
      letter-spacing: 0;
    }

    h3 {
      margin: 0;
      font-size: 17px;
      line-height: 1.16;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.38;
    }

    .avatar {
      display: inline-grid;
      place-items: center;
      flex: 0 0 auto;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      color: #fff;
      background: linear-gradient(160deg, #1dbd69, #068345);
      border: 4px solid #e8f8ed;
      box-shadow: 0 7px 18px rgba(6, 122, 67, 0.24);
      font-size: 21px;
      font-weight: 900;
    }

    .avatar.small {
      width: 44px;
      height: 44px;
      border-width: 0;
      color: var(--green);
      background: var(--green-light);
      box-shadow: none;
      font-size: 17px;
    }

    .route-scene {
      height: 176px;
      position: relative;
      overflow: hidden;
      border-radius: 14px;
      border: 1px solid #edf1ef;
      background: #f8faf9;
      box-shadow: 0 14px 30px rgba(11, 23, 42, 0.08);
    }

    .route-image {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
      transform-origin: center;
    }

    .stack {
      display: grid;
      gap: 16px;
    }

    .summary-card,
    .driver-card,
    .rider-card,
    .detail-card,
    .map-panel,
    .empty-card {
      border: 1px solid #e3ebe8;
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 10px 24px rgba(11, 23, 42, 0.08);
    }

    .summary-card {
      display: grid;
      grid-template-columns: 56px 1fr auto;
      gap: 16px;
      align-items: center;
      padding: 18px;
    }

    .summary-icon {
      display: grid;
      place-items: center;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      color: var(--green);
      background: var(--green-light);
      font-size: 24px;
      font-weight: 900;
    }

    .count {
      display: block;
      margin-top: 3px;
      font-size: 38px;
      line-height: 1;
      color: #102235;
      font-weight: 900;
    }

    .primary-action,
    .secondary-action,
    .mark-button {
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
    }

    .primary-action {
      border: 0;
      color: #fff;
      background: linear-gradient(180deg, #12b96a, #07984f);
      box-shadow: 0 14px 24px rgba(7, 152, 79, 0.24);
    }

    .secondary-action,
    .mark-button {
      border: 1.5px solid #d1d9d6;
      color: #111827;
      background: #fff;
    }

    .mark-button {
      color: var(--green-dark);
      border-color: rgba(7, 152, 79, 0.45);
    }

    .mark-button.is-picked {
      color: #fff;
      background: var(--green);
      border-color: var(--green);
    }

    .driver-list,
    .riders-list {
      display: grid;
      gap: 12px;
    }

    .driver-card,
    .rider-card {
      width: 100%;
      min-height: 100px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 14px;
      align-items: center;
      padding: 14px;
      color: inherit;
      text-align: left;
      cursor: pointer;
    }

    .driver-card {
      border-color: rgba(6, 152, 80, 0.3);
      background: linear-gradient(135deg, #effaf3, #ffffff);
    }

    .driver-card strong,
    .rider-card strong {
      display: block;
      margin-bottom: 5px;
      font-size: 16px;
      line-height: 1.15;
    }

    .chevron {
      color: #102235;
      font-size: 30px;
      line-height: 1;
    }

    .stop-number {
      display: inline-grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      color: #fff;
      background: linear-gradient(160deg, #10ad61, #078246);
      font-size: 13px;
      font-weight: 900;
    }

    .rider-card {
      grid-template-columns: 30px 1fr auto;
      min-height: 112px;
      background: #fff;
    }

    .rider-address {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .rider-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .pill,
    .picked-chip {
      display: inline-flex;
      align-items: center;
      min-height: 23px;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 850;
    }

    .pill {
      color: var(--green-dark);
      background: var(--green-light);
    }

    .pill.gray {
      color: #344054;
      background: #eef2f0;
    }

    .picked-chip {
      display: none;
      color: var(--green-dark);
      background: var(--green-light);
    }

    .rider-card.is-picked .picked-chip {
      display: inline-flex;
    }

    .detail-top {
      display: grid;
      grid-template-columns: 42px 1fr 32px;
      align-items: center;
      gap: 10px;
    }

    .detail-top h2 {
      text-align: center;
    }

    .person-banner {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 14px;
      align-items: center;
      padding-top: 8px;
    }

    .person-banner h1 {
      font-size: 22px;
      line-height: 1.1;
    }

    .detail-card {
      padding: 6px 16px;
      box-shadow: 0 10px 24px rgba(11, 23, 42, 0.06);
    }

    .detail-row {
      display: grid;
      grid-template-columns: 30px 1fr;
      gap: 12px;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid #e6ece9;
    }

    .detail-row:last-child {
      border-bottom: 0;
    }

    .detail-icon {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      color: #344054;
      font-weight: 900;
    }

    .detail-row small {
      display: block;
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
    }

    .detail-row strong {
      display: block;
      color: #111827;
      font-size: 15px;
      line-height: 1.32;
      overflow-wrap: anywhere;
    }

    .map-panel {
      height: 170px;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.72), rgba(255, 255, 255, 0.38)),
        linear-gradient(35deg, transparent 0 12%, rgba(160, 198, 175, 0.28) 12% 27%, transparent 27% 100%),
        repeating-linear-gradient(35deg, #f3f6f4 0 3px, transparent 3px 42px),
        repeating-linear-gradient(125deg, #f0f4f2 0 3px, transparent 3px 46px);
    }

    .map-line {
      position: absolute;
      height: 7px;
      border-radius: 20px;
      background: var(--green);
      transform-origin: left center;
    }

    .map-line.one {
      width: 105px;
      left: 72px;
      bottom: 54px;
      transform: rotate(63deg);
    }

    .map-line.two {
      width: 150px;
      left: 139px;
      top: 92px;
      transform: rotate(-19deg);
    }

    .map-dot {
      position: absolute;
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      color: #fff;
      background: var(--green);
      box-shadow: 0 0 0 7px rgba(255, 255, 255, 0.84), 0 8px 18px rgba(7, 152, 79, 0.2);
      font-size: 18px;
      line-height: 1;
    }

    .map-dot.start { left: 55px; bottom: 58px; }
    .map-dot.end { right: 42px; top: 48px; }

    .map-label {
      position: absolute;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.9);
      color: #334155;
      font-size: 11px;
      font-weight: 850;
    }

    .start-label { left: 43px; bottom: 23px; }
    .end-label { right: 44px; top: 91px; }

    .map-logo {
      display: grid;
      place-items: center;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      color: #fff;
      font-size: 13px;
      font-weight: 900;
    }

    .map-logo.google {
      background: conic-gradient(from 40deg, #4285f4, #34a853, #fbbc04, #ea4335, #4285f4);
    }

    .map-logo.apple {
      background: conic-gradient(from 20deg, #5ac8fa, #34c759, #ffcc00, #ff3b30, #af52de, #5ac8fa);
    }

    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 0;
      z-index: 10;
      width: var(--app-width);
      transform: translateX(-50%);
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 4px;
      padding: 10px 42px calc(18px + env(safe-area-inset-bottom));
      border-top: 1px solid #e4ebe8;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
    }

    .nav-item {
      display: grid;
      place-items: center;
      gap: 4px;
      border: 0;
      background: transparent;
      color: #111827;
      font-size: 11px;
      font-weight: 750;
      cursor: pointer;
    }

    .nav-item.active {
      color: var(--green);
    }

    .nav-icon {
      display: grid;
      place-items: center;
      width: 28px;
      height: 24px;
      font-size: 20px;
      line-height: 1;
    }

    .empty-card {
      padding: 18px;
    }

    .error {
      color: var(--danger);
      font-weight: 800;
    }

    .modal {
      position: absolute;
      inset: 0;
      z-index: 12;
      display: none;
      place-items: end center;
      padding: 18px;
      background: rgba(16, 34, 53, 0.38);
    }

    .modal.open {
      display: grid;
    }

    .modal-card {
      width: 100%;
      display: grid;
      gap: 14px;
      padding: 18px;
      border-radius: 12px;
      border: 1px solid #dfe7e4;
      background: #fff;
      box-shadow: var(--shadow);
    }

    .modal-card input {
      width: 100%;
      height: 52px;
      padding: 0 14px;
      border: 1.5px solid #cfd8d4;
      border-radius: 8px;
      color: var(--ink);
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .primary-action:focus-visible,
    .secondary-action:focus-visible,
    .driver-card:focus-visible,
    .rider-card:focus-visible,
    .nav-item:focus-visible,
    .back-button:focus-visible,
    .icon-button:focus-visible,
    .mark-button:focus-visible,
    input:focus-visible {
      outline: 3px solid rgba(7, 152, 79, 0.34);
      outline-offset: 3px;
    }

    @media (max-width: 380px) {
      .screen {
        padding-inline: 16px;
      }

      h1 {
        font-size: 42px;
      }

      .bottom-nav {
        padding-inline: 34px;
      }
    }

    @media (min-width: 900px) {
      .page { background: #f5fbf7; }
    }

    :root {
      --ink: #050505;
      --muted: #6b7280;
      --line: #e5e7eb;
      --panel: #ffffff;
      --soft: #f4f4f4;
      --green: #0b3d2e;
      --green-dark: #0b3d2e;
      --green-light: #eef3ef;
      --shadow: 0 14px 34px rgba(0, 0, 0, 0.08);
      --app-width: min(100vw, 430px);
    }

    html,
    body {
      background: #0b3d2e;
    }

    .page {
      min-height: 100dvh;
      background: #ffffff;
    }

    .phone {
      width: var(--app-width);
      min-height: 100dvh;
      background: #ffffff;
    }

    .screen {
      padding: 30px 28px calc(92px + env(safe-area-inset-bottom));
      background: #ffffff;
    }

    .screen.full-bottom {
      padding-bottom: calc(30px + env(safe-area-inset-bottom));
    }

    .stack {
      gap: 20px;
    }

    .intro-block {
      display: grid;
      gap: 7px;
    }

    .intro-block.compact {
      gap: 6px;
    }

    .intro-block h1 {
      margin: 0;
      color: #050505;
      font-size: 29px;
      line-height: 1.05;
      font-weight: 850;
      letter-spacing: 0;
    }

    .intro-block h2 {
      margin-top: 4px;
      color: #050505;
      font-size: 28px;
      line-height: 1.05;
      font-weight: 850;
      letter-spacing: 0;
    }

    .eyebrow {
      margin-top: 22px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .home-art {
      height: 188px;
      margin-top: 16px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 1px solid #eeeeee;
      border-radius: 16px;
      background: #fbfcfc;
      box-shadow: 0 16px 38px rgba(0, 0, 0, 0.08);
    }

    .home-art img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
    }

    .route-scene {
      height: 226px;
      margin-top: 14px;
      border: 0;
      border-radius: 16px;
      background: #f1f3f2;
      box-shadow: none;
    }

    .route-scene.compact {
      height: 180px;
      margin-top: 12px;
    }

    .summary-card,
    .driver-card,
    .rider-card,
    .detail-card,
    .empty-card,
    .passcode-card {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #ffffff;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.04);
    }

    .summary-card {
      display: block;
      padding: 22px;
    }

    .summary-card.dark {
      border: 0;
      color: #ffffff;
      background: #000000;
      box-shadow: none;
    }

    .summary-card.dark p {
      color: #d1d5db;
    }

    .summary-card.dark .count {
      color: #ffffff;
    }

    .summary-card.dark div {
      display: grid;
      grid-template-columns: auto 1fr;
      column-gap: 22px;
      align-items: end;
    }

    .summary-card.dark p:first-child {
      grid-column: 1 / -1;
    }

    .summary-card.dark p:last-child {
      padding-bottom: 4px;
      color: #ffffff;
      font-weight: 750;
    }

    .count {
      margin-top: 8px;
      color: #050505;
      font-size: 46px;
      font-weight: 850;
      line-height: 0.95;
    }

    .primary-action,
    .secondary-action,
    .mark-button {
      min-height: 60px;
      border-radius: 5px;
      font-size: 16px;
      font-weight: 750;
      box-shadow: none;
    }

    .primary-action {
      border: 0;
      color: #ffffff;
      background: #000000;
    }

    .secondary-action,
    .mark-button {
      border: 1px solid var(--line);
      color: #050505;
      background: #ffffff;
    }

    .mark-button {
      border-color: #cfd4d2;
    }

    .mark-button.is-picked {
      color: #ffffff;
      background: #000000;
      border-color: #000000;
    }

    .destination-block {
      display: grid;
      gap: 5px;
      padding: 8px 20px 16px;
    }

    .destination-block h2 {
      color: #050505;
      font-size: 26px;
      font-weight: 850;
    }

    .passcode-card {
      padding: 17px 20px;
      background: #f4f4f4;
      border: 0;
      box-shadow: none;
    }

    .passcode-card strong {
      display: block;
      margin-top: 6px;
      color: #050505;
      font-size: 17px;
    }

    .driver-list,
    .riders-list,
    .route-list {
      display: grid;
      gap: 12px;
    }

    .driver-card {
      min-height: 76px;
      grid-template-columns: 48px 1fr auto;
      padding: 14px;
      border-color: #dfe3e6;
      background: #ffffff;
    }

    .driver-card .avatar.small {
      width: 44px;
      height: 44px;
      color: #ffffff;
      background: #000000;
      border: 0;
      box-shadow: none;
      font-size: 14px;
    }

    .driver-card strong,
    .route-stop strong {
      color: #050505;
      font-size: 17px;
      font-weight: 800;
    }

    .driver-card p {
      max-width: 165px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 12px;
    }

    .pill {
      min-height: 28px;
      padding: 4px 10px;
      color: #050505;
      background: #f1f1f1;
      font-size: 12px;
      font-weight: 750;
      white-space: nowrap;
    }

    .title-row {
      display: grid;
      grid-template-columns: 36px 1fr;
      gap: 10px;
      align-items: start;
    }

    .back-button {
      width: 34px;
      height: 34px;
      color: #050505;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      font-size: 25px;
      font-weight: 700;
    }

    .route-list h2 {
      margin: 12px 0 8px;
      color: #050505;
      font-size: 18px;
      font-weight: 850;
    }

    .route-stop {
      width: 100%;
      display: grid;
      grid-template-columns: 30px 1fr auto;
      gap: 14px;
      align-items: start;
      padding: 14px 0;
      border: 0;
      border-bottom: 1px solid var(--line);
      color: inherit;
      background: transparent;
      text-align: left;
      cursor: pointer;
    }

    .route-stop.destination {
      cursor: default;
    }

    .route-stop.is-picked .stop-number {
      background: #16a34a;
    }

    .stop-number {
      width: 28px;
      height: 28px;
      color: #ffffff;
      background: #000000;
      font-size: 13px;
      font-weight: 850;
    }

    .stop-copy {
      display: grid;
      gap: 4px;
      min-width: 0;
    }

    .stop-copy span,
    .stop-copy small {
      display: block;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .stop-time {
      padding-top: 2px;
      color: #050505;
      font-size: 12px;
      font-weight: 750;
      white-space: nowrap;
    }

    .route-start {
      margin-top: 12px;
    }

    .person-banner {
      grid-template-columns: 44px 1fr auto;
      padding: 0;
    }

    .person-banner .avatar.small {
      color: #ffffff;
      background: #000000;
      border: 0;
      box-shadow: none;
    }

    .detail-card {
      padding: 0 18px;
      box-shadow: none;
    }

    .detail-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 4px;
      padding: 15px 0;
      border-bottom: 1px solid var(--line);
    }

    .detail-row small {
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
    }

    .detail-row strong {
      color: #050505;
      font-size: 17px;
      font-weight: 800;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .bottom-nav {
      width: var(--app-width);
      gap: 4px;
      padding: 12px 56px calc(18px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.96);
    }

    .bottom-nav[hidden] {
      display: none;
    }

    .nav-item {
      color: #9ca3af;
      font-size: 12px;
      font-weight: 750;
    }

    .nav-item.active {
      color: #000000;
    }

    .nav-icon {
      position: relative;
      width: 30px;
      height: 28px;
      font-size: 0;
    }

    .nav-icon svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .home-fill {
      display: none;
    }

    .nav-item.active .home-outline {
      display: none;
    }

    .nav-item.active .home-fill {
      display: block;
    }

    .modal {
      position: absolute;
      inset: 0;
      padding: 18px;
      background: rgba(0, 0, 0, 0.42);
    }

    .modal-card {
      gap: 14px;
      border: 0;
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    }

    .modal-card input {
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 18px;
    }

    .primary-action:focus-visible,
    .secondary-action:focus-visible,
    .driver-card:focus-visible,
    .route-stop:focus-visible,
    .nav-item:focus-visible,
    .back-button:focus-visible,
    .mark-button:focus-visible,
    input:focus-visible {
      outline: 3px solid rgba(0, 0, 0, 0.18);
      outline-offset: 3px;
    }

    @media (max-width: 380px) {
      .screen {
        padding-inline: 22px;
      }

      .intro-block h1 {
        font-size: 27px;
      }

      .intro-block h2 {
        font-size: 25px;
      }

      .route-scene {
        height: 206px;
      }

      .route-scene.compact {
        height: 160px;
      }

      .bottom-nav {
        padding-inline: 44px;
      }
    }

    @media (min-width: 700px) {
      .page {
        display: grid;
        place-items: start center;
        background: #0b3d2e;
      }

      .phone {
        min-height: 100dvh;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <article class="phone" aria-live="polite">
      <div id="screen" class="screen"></div>

      <nav class="bottom-nav" aria-label="Main navigation">
        <button id="homeNav" class="nav-item active" type="button">
          <span class="nav-icon home-icon" aria-hidden="true">
            <svg class="home-outline" viewBox="0 0 28 28" focusable="false">
              <path d="M5 12.5 14 4l9 8.5v10.2h-6.2v-7h-5.6v7H5V12.5Z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
            </svg>
            <svg class="home-fill" viewBox="0 0 28 28" focusable="false">
              <path d="M5 12.5 14 4l9 8.5v10.2h-6.2v-7h-5.6v7H5V12.5Z" fill="currentColor"/>
            </svg>
          </span>
          <span>Home</span>
        </button>
        <button id="profileNav" class="nav-item" type="button">
          <span class="nav-icon profile-icon" aria-hidden="true">
            <svg viewBox="0 0 28 28" focusable="false">
              <circle cx="14" cy="9" r="4.2" fill="none" stroke="currentColor" stroke-width="2"/>
              <path d="M5.5 24c1.6-5.1 5-7.7 8.5-7.7S20.9 18.9 22.5 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </span>
          <span>My Profile</span>
        </button>
      </nav>

      <div id="codeModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <form id="codeForm" class="modal-card">
          <div>
            <h2 id="modalTitle">Driver code</h2>
            <p id="modalDriver"></p>
          </div>
          <input id="driverCode" type="password" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false">
          <p id="codeError" class="error" hidden></p>
          <div class="modal-actions">
            <button class="secondary-action" type="button" id="cancelCode">Cancel</button>
            <button class="primary-action" type="submit">Open route</button>
          </div>
        </form>
      </div>
    </article>
  </main>

  <script>
    const SUPABASE_URL = "https://cpkimtrribpvqxbywfry.supabase.co";
    const SUPABASE_KEY = "sb_publishable_qegP80qyqPq3qjqm6J3DIg_M4eNbRaZ";
    const PLAN_DATE = "2026-08-02";

    const state = {
      view: "home",
      drivers: [],
      selectedDriver: null,
      route: null,
      selectedRider: null,
      loading: true,
      error: "",
    };

    const screen = document.querySelector("#screen");
    const homeNav = document.querySelector("#homeNav");
    const profileNav = document.querySelector("#profileNav");
    const bottomNav = document.querySelector(".bottom-nav");
    const codeModal = document.querySelector("#codeModal");
    const codeForm = document.querySelector("#codeForm");
    const driverCode = document.querySelector("#driverCode");
    const modalDriver = document.querySelector("#modalDriver");
    const codeError = document.querySelector("#codeError");

    const escapeHtml = (value) => String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#39;");

    const encodeAddress = (address) => encodeURIComponent(address || "");
    const googleMaps = (address) => "https://www.google.com/maps/search/?api=1&query=" + encodeAddress(address);
    const appleMaps = (address) => "https://maps.apple.com/?q=" + encodeAddress(address);
    const telHref = (phone) => {
      const digits = String(phone || "").replace(/\D/g, "");
      if (!digits) return "";
      return "tel:+" + (digits.length === 10 ? "1" + digits : digits);
    };

    async function rpc(name, body) {
      const response = await fetch(SUPABASE_URL + "/rest/v1/rpc/" + name, {
        method: "POST",
        headers: {
          "apikey": SUPABASE_KEY,
          "authorization": "Bearer " + SUPABASE_KEY,
          "content-type": "application/json",
        },
        body: JSON.stringify(body),
      });

      if (!response.ok) {
        const message = await response.text();
        throw new Error(message || "Supabase request failed");
      }

      return response.json();
    }

    async function loadDrivers() {
      state.loading = true;
      state.error = "";
      render();

      try {
        state.drivers = await rpc("ride_driver_directory", { p_plan_date: PLAN_DATE });
      } catch (error) {
        state.error = "Could not load drivers.";
        console.error(error);
      } finally {
        state.loading = false;
        render();
      }
    }

    const ROUTE_IMAGES = {
      "joojo": { src: "assets/route-map-1.png", position: "center 50%", scale: "1.02" },
      "john-mark": { src: "assets/route-map-2.png", position: "center 50%", scale: "1.02" },
      "annie": { src: "assets/route-map-3.png", position: "center 50%", scale: "1.02" },
      "dawson": { src: "assets/route-map-1.png", position: "center 38%", scale: "1.10" },
      "naa": { src: "assets/route-map-2.png", position: "center 62%", scale: "1.09" },
      "blue": { src: "assets/route-map-3.png", position: "center 36%", scale: "1.08" },
      "default": { src: "assets/route-map-1.png", position: "center 50%", scale: "1.02" },
    };

    function routeScene(driverSlug = "default", variant = "dashboard") {
      const routeImage = ROUTE_IMAGES[driverSlug] || ROUTE_IMAGES.default;
      const compactClass = variant === "review" ? " compact" : "";
      return `
        <div class="route-scene${compactClass}" aria-hidden="true">
          <img class="route-image" src="${routeImage.src}" style="object-position: ${routeImage.position}; transform: scale(${routeImage.scale});" alt="">
        </div>`;
    }

    function homeArt() {
      return `
        <div class="home-art" aria-hidden="true">
          <img src="assets/home-car.png" alt="">
        </div>`;
    }

    function countRiders() {
      return state.drivers.reduce((sum, driver) => sum + Number(driver.pickup_count || 0), 0);
    }

    function setView(view) {
      state.view = view;
      state.selectedRider = null;
      render();
    }

    function setDriverHome() {
      state.view = "driverHome";
      state.selectedRider = null;
      render();
    }

    function setRidesView() {
      state.view = "rides";
      state.selectedRider = null;
      render();
    }

    function openProfile() {
      setView("profile");
    }

    function openHome() {
      setView("home");
    }

    function setActiveNav() {
      const routeScreen = state.view === "rides" || state.view === "detail";
      bottomNav.hidden = routeScreen;
      screen.classList.toggle("full-bottom", routeScreen);
      homeNav.classList.toggle("active", state.view === "home" || state.view === "driverHome" || routeScreen);
      profileNav.classList.toggle("active", state.view === "profile");
    }

    function homeView() {
      return `
        <div class="stack">
          <section class="intro-block" aria-label="Sunday ride dashboard">
            <p class="eyebrow">Today</p>
            <h1>Sunday Ride Plan</h1>
            <p>${state.loading ? "Loading drivers..." : `${state.drivers.length} drivers assigned`}</p>
            ${homeArt()}
          </section>

          <section class="summary-card dark">
            <div>
              <p>Total pickups</p>
              <strong class="count">${state.loading ? "..." : countRiders()}</strong>
              <p>Sunday · UH Hilton</p>
            </div>
          </section>

          <button class="primary-action" type="button" data-action="profile">Choose driver <span aria-hidden="true">&rarr;</span></button>
          ${state.error ? `<section class="empty-card"><p class="error">${escapeHtml(state.error)}</p></section>` : ""}
        </div>`;
    }

    function profileView() {
      const driverCards = state.loading
        ? `<section class="empty-card"><p>Loading drivers...</p></section>`
        : state.drivers.map((driver) => `
          <button class="driver-card" type="button" data-driver="${escapeHtml(driver.slug)}" aria-label="Open ${escapeHtml(driver.display_name)} profile">
            <span class="avatar small">${escapeHtml(driver.initials)}</span>
            <span>
              <strong>${escapeHtml(driver.display_name)}</strong>
              <p>${escapeHtml(driver.subtitle)}</p>
            </span>
            <span class="pill">${Number(driver.pickup_count || 0)} pickups</span>
          </button>
        `).join("");

      return `
        <div class="stack">
          <section class="intro-block compact">
            <h1>My Profile</h1>
            <p>Choose your driver</p>
            <p class="eyebrow">Today</p>
            <h2>Sunday Ride Plan</h2>
            <p>${state.loading ? "Loading drivers..." : `${state.drivers.length} drivers assigned`}</p>
          </section>
          <section class="driver-list" aria-label="Drivers">
            ${driverCards}
          </section>
          ${state.error ? `<section class="empty-card"><p class="error">${escapeHtml(state.error)}</p></section>` : ""}
        </div>`;
    }

    function driverHomeView() {
      const driver = state.route?.driver;
      const riders = state.route?.riders || [];
      const destination = state.route?.destination;
      const riderNames = riders.map((rider) => rider.name).join(" and ");

      return `
        <div class="stack">
          <section class="intro-block compact" aria-label="${escapeHtml(driver.displayName)} dashboard">
            <h1>Good day, ${escapeHtml(driver.displayName)}</h1>
            <p>Driver mode</p>
            ${routeScene(driver.slug)}
          </section>

          <section class="summary-card dark">
            <div>
              <p>Total pickups</p>
              <strong class="count">${riders.length}</strong>
              <p>${escapeHtml(riderNames || "No riders assigned")}</p>
            </div>
          </section>

          <section class="destination-block">
            <p>Destination</p>
            <h2>${escapeHtml(destination.label)}</h2>
            <p>${escapeHtml(destination.address)}</p>
          </section>

          <button class="primary-action" type="button" data-action="rides">View my rides <span aria-hidden="true">&rarr;</span></button>
        </div>`;
    }

    function readyText(rider) {
      return rider.readyBy ? `Ready by ${rider.readyBy}` : "Coordinate pickup directly";
    }

    function pickupTimeText(rider) {
      return rider.pickupTime || "";
    }

    function routeStopRow(rider) {
      return `
        <button class="route-stop" type="button" data-rider="${Number(rider.stopOrder)}" aria-label="Open ${escapeHtml(rider.name)} pickup details">
          <span class="stop-number">${Number(rider.stopOrder)}</span>
          <span class="stop-copy">
            <strong>${escapeHtml(rider.name)}</strong>
            <span>${escapeHtml(rider.address)}</span>
            <small>${escapeHtml(readyText(rider))}</small>
          </span>
          <span class="stop-time">${escapeHtml(pickupTimeText(rider))}</span>
        </button>`;
    }

    function routeTarget(riders, destination) {
      const nextRider = riders.find((rider) => !getPicked(rider.stopOrder));
      if (nextRider) {
        return {
          address: nextRider.address,
          label: `Start route to ${nextRider.name}`,
          allPicked: false,
        };
      }

      return {
        address: destination.address,
        label: `Start route to ${destination.label}`,
        allPicked: true,
      };
    }

    function ridesView() {
      const driver = state.route?.driver;
      const riders = state.route?.riders || [];
      const destination = state.route?.destination;
      const target = routeTarget(riders, destination);

      const cards = riders.map(routeStopRow).join("");

      return `
        <div class="stack">
          <section class="intro-block compact">
            <div class="title-row">
              <button class="back-button" type="button" data-action="driverHome" aria-label="Back">&larr;</button>
              <div>
                <h1>Review route</h1>
                <p>${escapeHtml(driver.displayName)}'s pickups</p>
              </div>
            </div>
            ${routeScene(driver.slug, "review")}
          </section>

          <section class="route-list" aria-label="Assigned riders">
            <h2>Pick-up</h2>
            ${cards}
          </section>

          <section class="route-list" aria-label="Drop off">
            <h2>Drop-off</h2>
            <div class="route-stop destination ${target.allPicked ? "is-picked" : ""}">
              <span class="stop-number">✓</span>
              <span class="stop-copy">
                <strong>${escapeHtml(destination.label)}</strong>
                <span>${escapeHtml(destination.address)}</span>
                <small>${target.allPicked ? "Ready for final route" : "Final destination"}</small>
              </span>
            </div>
          </section>

          <a class="primary-action route-start" href="${googleMaps(target.address)}" target="_blank" rel="noreferrer">${escapeHtml(target.label)} <span aria-hidden="true">&rarr;</span></a>
        </div>`;
    }

    function detailRows(rider) {
      return [
        `<div class="detail-row"><small>Address</small><strong>${escapeHtml(rider.address)}</strong></div>`,
        rider.phone ? `<div class="detail-row"><small>Phone</small><strong>${escapeHtml(rider.phone)}</strong></div>` : "",
        rider.routeLabel ? `<div class="detail-row"><small>Route</small><strong>${escapeHtml(rider.routeLabel)}</strong></div>` : "",
        rider.pickupTime ? `<div class="detail-row"><small>Pickup time</small><strong>${escapeHtml(rider.pickupTime)}</strong></div>` : "",
        rider.readyBy ? `<div class="detail-row"><small>Ready by</small><strong>${escapeHtml(rider.readyBy)}</strong></div>` : "",
        `<div class="detail-row"><small>Notes</small><strong>${escapeHtml(rider.notes || "Coordinate pickup directly.")}</strong></div>`,
      ].join("");
    }

    function detailView() {
      const rider = state.selectedRider;
      const driver = state.route?.driver;
      const picked = getPicked(rider.stopOrder);
      const phoneLink = telHref(rider.phone);

      return `
        <div class="stack">
          <section class="intro-block compact">
            <div class="title-row">
              <button class="back-button" type="button" data-action="rides" aria-label="Back">&larr;</button>
              <div>
                <h1>Pickup details</h1>
                <p>${escapeHtml(rider.area)}</p>
              </div>
            </div>
            ${routeScene(driver.slug, "review")}
          </section>

          <section class="person-banner">
            <span class="avatar small">${escapeHtml(rider.name.slice(0, 1))}</span>
            <div>
              <h2>${escapeHtml(rider.name)}</h2>
              <p>${escapeHtml(rider.address)}</p>
            </div>
            <span class="stop-number">${Number(rider.stopOrder)}</span>
          </section>
          <section class="detail-card">
            ${detailRows(rider)}
          </section>

          <a class="primary-action" href="${googleMaps(rider.address)}" target="_blank" rel="noreferrer">
            <span>Open in Google Maps</span>
          </a>
          <a class="secondary-action" href="${appleMaps(rider.address)}" target="_blank" rel="noreferrer">
            <span>Open in Apple Maps</span>
          </a>
          ${phoneLink ? `<a class="secondary-action" href="${phoneLink}">Call rider</a>` : ""}
          <button class="mark-button ${picked ? "is-picked" : ""}" type="button" data-mark="${Number(rider.stopOrder)}">
            <span>✓</span>
            <span>${picked ? "Picked up" : "Mark picked up"}</span>
          </button>
        </div>`;
    }

    function getStorageKey(stopOrder) {
      const driver = state.route?.driver?.slug || "driver";
      return "ride-picked-" + PLAN_DATE + "-" + driver + "-" + stopOrder;
    }

    function getPicked(stopOrder) {
      return localStorage.getItem(getStorageKey(stopOrder)) === "1";
    }

    function setPicked(stopOrder, value) {
      localStorage.setItem(getStorageKey(stopOrder), value ? "1" : "0");
      render();
    }

    function render() {
      setActiveNav();
      if (state.view === "profile") screen.innerHTML = profileView();
      else if (state.view === "driverHome" && state.route) screen.innerHTML = driverHomeView();
      else if (state.view === "rides" && state.route) screen.innerHTML = ridesView();
      else if (state.view === "detail" && state.selectedRider) screen.innerHTML = detailView();
      else screen.innerHTML = homeView();
      syncPickedChips();
    }

    function syncPickedChips() {
      document.querySelectorAll(".rider-card[data-rider], .route-stop[data-rider]").forEach((card) => {
        const stopOrder = card.dataset.rider;
        card.classList.toggle("is-picked", getPicked(stopOrder));
      });
    }

    async function openCodeModal(slug) {
      state.selectedDriver = state.drivers.find((driver) => driver.slug === slug);
      modalDriver.textContent = state.selectedDriver?.display_name || "";
      codeError.hidden = true;
      codeError.textContent = "";
      driverCode.value = "";
      codeModal.classList.add("open");
      requestAnimationFrame(() => driverCode.focus());
    }

    function closeCodeModal() {
      codeModal.classList.remove("open");
      codeError.hidden = true;
      codeError.textContent = "";
    }

    async function submitCode(event) {
      event.preventDefault();
      if (!state.selectedDriver) return;
      codeError.hidden = true;
      codeError.textContent = "";

      try {
        const route = await rpc("ride_driver_route", {
          p_driver_slug: state.selectedDriver.slug,
          p_access_code: driverCode.value,
          p_plan_date: PLAN_DATE,
        });

        if (!route?.ok) {
          codeError.textContent = "Code did not match.";
          codeError.hidden = false;
          return;
        }

        state.route = route;
        closeCodeModal();
        setDriverHome();
      } catch (error) {
        codeError.textContent = "Route could not open.";
        codeError.hidden = false;
        console.error(error);
      }
    }

    screen.addEventListener("click", (event) => {
      const action = event.target.closest("[data-action]")?.dataset.action;
      if (action === "home") openHome();
      if (action === "profile") openProfile();
      if (action === "driverHome") setDriverHome();
      if (action === "rides") setRidesView();

      const driverButton = event.target.closest("[data-driver]");
      if (driverButton) openCodeModal(driverButton.dataset.driver);

      const riderButton = event.target.closest("[data-rider]");
      if (riderButton) {
        const stopOrder = Number(riderButton.dataset.rider);
        state.selectedRider = (state.route?.riders || []).find((rider) => Number(rider.stopOrder) === stopOrder);
        if (state.selectedRider) {
          state.view = "detail";
          render();
        }
      }

      const markButton = event.target.closest("[data-mark]");
      if (markButton) {
        const stopOrder = markButton.dataset.mark;
        setPicked(stopOrder, !getPicked(stopOrder));
      }
    });

    homeNav.addEventListener("click", () => {
      if (state.route) setDriverHome();
      else openHome();
    });
    profileNav.addEventListener("click", openProfile);
    codeForm.addEventListener("submit", submitCode);
    document.querySelector("#cancelCode").addEventListener("click", closeCodeModal);
    codeModal.addEventListener("click", (event) => {
      if (event.target === codeModal) closeCodeModal();
    });

    loadDrivers();
  </script>
</body>
</html>
