        timeLabel: "38 min to UH Hilton",
      },
      "danny": {
        routeLabel: "Richmond Route",
        startLabel: "Starts 8:45 AM",
        timeLabel: "1 hr to UH Hilton",
      },
      "dq": {
        routeLabel: "South Houston Route",
        startLabel: "Starts 12:00 PM",
        timeLabel: "Route time pending",
      },
      "precious": {
        routeLabel: "South Houston Route",
        startLabel: "Starts 10:00 AM",
        timeLabel: "Route time pending",
      },
      "naa": {
        routeLabel: "No pickups assigned",
      },
      "blue": {
        routeLabel: "Southeast Houston Route",
        timeLabel: "1 hr 5 min to UH Hilton",
      },
    };

    function routeScene(driverSlug = "default", variant = "dashboard") {
      const routeImage = ROUTE_IMAGES[driverSlug] || ROUTE_IMAGES.default;
      const compactClass = variant === "review" ? " compact" : "";
      return `
        <div class="route-scene${compactClass}" aria-hidden="true">
          <img class="route-image" src="${routeImage.src}" style="object-position: ${routeImage.position}; transform: scale(${routeImage.scale});" alt="">
        </div>`;
    }

    function homeArt() {
      return `
        <div class="home-art" aria-hidden="true">
          <img src="assets/home-car.png" alt="">
        </div>`;
    }

    function countRiders() {
      return state.drivers.reduce((sum, driver) => sum + Number(driver.pickup_count || 0), 0);
    }

    function pickupCountLabel(count) {
      const total = Number(count || 0);
      return `${total} Pickup${total === 1 ? "" : "s"}`;
    }

    function routeTimeLabel(summary) {
      if (!summary?.timeLabel) return "";
      return summary.startLabel ? `${summary.startLabel} · ${summary.timeLabel}` : summary.timeLabel;
    }

    function totalRouteTimeLabel(summary) {
      const label = String(summary?.timeLabel || "").trim();
      if (!label || /pending/i.test(label)) return "Total route time pending";
      return `Total route: ${label}`;
    }

    function routeTimingForDriver(slug) {
      if (!slug) return null;
      return state.routeTimings?.[slug] || null;
    }

    function orderedStops(stops = []) {
      return stops
        .slice()
        .sort((a, b) => Number(a.stopOrder || 0) - Number(b.stopOrder || 0) || String(a.name || "").localeCompare(String(b.name || "")));
    }

    function normalizeRouteArea(area) {
      const label = String(area || "").trim();
      if (!label) return "";
      if (/route$/i.test(label)) return label;
      if (/^(uh|uh campus|campus|campus area|home|neighborhood)$/i.test(label)) return "Neighborhood Route";
      return `${label} Route`;
    }

    function routeAreaFromStops(stops = []) {
      const labels = [];
      const seen = new Set();
      orderedStops(stops).forEach((stop) => {
        const label = normalizeRouteArea(stop.area);
        const key = label.toLowerCase();
        if (label && !seen.has(key)) {
          labels.push(label);
          seen.add(key);
        }
      });

      if (!labels.length) return "";
      if (labels.length === 1) return labels[0];
      return `${labels[0].replace(/\s+Route$/i, "")} + ${labels.length - 1} ${labels.length === 2 ? "area" : "areas"}`;
    }

    function firstPickupTime(stops = []) {
      const sorted = orderedStops(stops);
      const exactTime = sorted.find((stop) => stop.pickupTime && !/follow|after|next/i.test(stop.pickupTime));
      return (exactTime || sorted[0] || {}).pickupTime || "";
    }

    function driverRouteSummary(driver) {
      const directRouteLabel = normalizeRouteArea(driver.route_label || driver.routeLabel);
      return DRIVER_ROUTE_SUMMARIES[driver.slug] || {
        routeLabel: directRouteLabel || "Assigned Route",
        timeLabel: driver.time_label || driver.timeLabel || "Route time pending",
      };
    }

    function adminRouteHeaderSummary(driver, stops = []) {
      if (!stops.length) {
        return {
          routeLabel: "No pickups assigned",
          timingLabel: "",
        };
      }

      const summary = driverRouteSummary({ slug: driver.slug, routeLabel: driver.routeLabel, timeLabel: driver.timeLabel });
      const routeLabel = routeAreaFromStops(stops) || summary.routeLabel || "Assigned Route";
      const pickupTime = firstPickupTime(stops);
      return {
        routeLabel,
        timingLabel: pickupTime ? `Starts ${pickupTime}` : routeTimeLabel(summary),
      };
    }

    function driverDashboardMeta(driver, riders = [], destination = destinationSummary()) {
      const summary = driverRouteSummary(driver || {});
      const pickupTime = firstPickupTime(riders);
      const timing = routeTimingForDriver(driver?.slug);
      const hasLiveTiming = timing?.status === "ready" && timing.durationText;
      const isLoadingTiming = timing?.status === "loading";
      return {
        routeLabel: routeAreaFromStops(riders) || summary.routeLabel || "Assigned Route",
        firstPickupLine: riders.length ? `First pickup: ${pickupTime || "coordinate directly"}` : "No pickups assigned",
        timeLine: hasLiveTiming ? `Total route: ${timing.durationText}` : isLoadingTiming ? "Checking route time..." : totalRouteTimeLabel(summary),
        destinationLine: hasLiveTiming && timing.etaText ? `Estimated UH arrival: ${timing.etaText}` : timing?.status === "error" ? "Live timing unavailable" : `Ends at ${destination.label}`,
      };
    }

    function weatherCodeLabel(code) {
      const labels = {
        0: "Clear",
        1: "Mostly clear",
        2: "Partly cloudy",
        3: "Cloudy",
        45: "Foggy",
        48: "Foggy",
        51: "Light drizzle",
        53: "Drizzle",
        55: "Heavy drizzle",
        61: "Light rain",
        63: "Rain",
        65: "Heavy rain",
        80: "Rain showers",
        81: "Rain showers",
        82: "Heavy showers",
        95: "Thunderstorms",
      };
      return labels[Number(code)] || "Forecast";
    }

    function roundedWeatherValue(value) {
      if (value === null || value === undefined || value === "") return "";
      const number = Number(value);
      if (!Number.isFinite(number)) return "";
      return String(Math.round(number));
    }

    function weatherSummaryText() {
      if (state.weatherStatus === "loading") return `${WEATHER_LOCATION.label} forecast loading...`;
      if (state.weatherStatus === "error") return "Weather unavailable";
      const forecast = state.weatherForecast;
      if (!forecast) return "Tap to show Sunday forecast";
      return `${forecast.condition} · ${forecast.high}° / ${forecast.low}° · Rain ${forecast.rainChance}%`;
    }

    function weatherDetailsText() {
      const forecast = state.weatherForecast;
      if (state.weatherStatus === "loading") return `${WEATHER_LOCATION.label} forecast is loading.`;
      if (state.weatherStatus === "error") return "Forecast could not load for this Sunday.";
      if (!forecast) return "Open to check the Sunday forecast.";
      return `${WEATHER_LOCATION.label} · ${forecast.condition} · High ${forecast.high}°, low ${forecast.low}° · Rain ${forecast.rainChance}% · Wind ${forecast.wind} mph`;
    }

    function weatherApiUrl(dateValue = activePlanDate()) {
      const params = new URLSearchParams({
        latitude: WEATHER_LOCATION.latitude,
        longitude: WEATHER_LOCATION.longitude,
        daily: "weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max",
        temperature_unit: "fahrenheit",
        wind_speed_unit: "mph",
        timezone: "America/Chicago",
        start_date: dateValue,
        end_date: dateValue,
      });
      return "https://api.open-meteo.com/v1/forecast?" + params.toString();
    }

    async function loadWeatherForecast() {
      const dateValue = activePlanDate();
      if (state.weatherStatus === "loading") return;
      if (state.weatherStatus === "ready" && state.weatherDate === dateValue) return;

      state.weatherStatus = "loading";
      state.weatherForecast = null;
      state.weatherDate = dateValue;
      render();

      try {
        const response = await fetch(weatherApiUrl(dateValue));
        const payload = await response.json();
        if (!response.ok || payload?.error) throw new Error(payload?.reason || "Weather request failed");

        const daily = payload.daily || {};
        const index = (daily.time || []).indexOf(dateValue);
        if (index < 0) throw new Error("Forecast date unavailable");

        state.weatherForecast = {
          condition: weatherCodeLabel(daily.weather_code?.[index]),
          high: roundedWeatherValue(daily.temperature_2m_max?.[index]) || "--",
          low: roundedWeatherValue(daily.temperature_2m_min?.[index]) || "--",
          rainChance: roundedWeatherValue(daily.precipitation_probability_max?.[index]) || "0",
          wind: roundedWeatherValue(daily.wind_speed_10m_max?.[index]) || "--",
        };
        state.weatherStatus = "ready";
      } catch (error) {
        state.weatherStatus = "error";
        state.weatherForecast = null;
        console.warn(error);
      } finally {
        render();
      }
    }

    async function loadDriverRouteTiming(accessCode) {
      const driverSlug = state.route?.driver?.slug;
      if (!driverSlug || !accessCode) return;

      state.routeTimingStatus = "loading";
      state.routeTimingError = "";
      state.routeTimingPlanDate = activePlanDate();
      state.routeTimings = {
        ...(state.routeTimings || {}),
        [driverSlug]: { status: "loading" },
      };
      render();

      try {
        const timing = await secureRouteTimingRequest("driver", {
          planDate: activePlanDate(),
          driverSlug,
          accessCode,
        });

        if (!timing?.ok) throw new Error(timing?.error || "route_timing_failed");
        state.routeTimings = { ...(state.routeTimings || {}), ...(timing.timings || {}) };
        state.routeTimingStatus = "ready";
      } catch (error) {
        state.routeTimings = {
          ...(state.routeTimings || {}),
          [driverSlug]: { status: "error" },
        };
        state.routeTimingStatus = "error";
        state.routeTimingError = error.message;
        console.warn(error);
      } finally {
        render();
      }
    }

    async function loadAdminRouteTiming() {
      if (!state.admin) return;

      state.routeTimingStatus = "loading";
      state.routeTimingError = "";
      state.routeTimingPlanDate = activePlanDate();
      state.routeTimings = Object.fromEntries(adminDrivers().map((driver) => [driver.slug, { status: "loading" }]));
      render();

      try {
        const timing = await secureRouteTimingRequest("admin", {
          planDate: activePlanDate(),
          adminCode: state.adminCode,
          drivers: adminDrivers(),
          stops: adminStops(),
          destination: destinationSummary(),
        });

        if (!timing?.ok) throw new Error(timing?.error || "route_timing_failed");
        state.routeTimings = timing.timings || {};
        state.routeTimingStatus = "ready";
      } catch (error) {
        state.routeTimings = Object.fromEntries(adminDrivers().map((driver) => [driver.slug, { status: "error" }]));
        state.routeTimingStatus = "error";
        state.routeTimingError = error.message;
        console.warn(error);
      } finally {
        render();
      }
    }

    function iconSvg(name) {
      const icons = {
        pin: `<svg class="driver-meta-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 21s6-5.25 6-11a6 6 0 0 0-12 0c0 5.75 6 11 6 11Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="10" r="2.25" stroke="currentColor" stroke-width="2"/></svg>`,
        clock: `<svg class="driver-meta-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3 2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
        car: `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m5 12 1.5-4.5A2 2 0 0 1 8.4 6h7.2a2 2 0 0 1 1.9 1.5L19 12" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M4 12h16v6H4v-6Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M7 18v2M17 18v2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="7.5" cy="15" r="1" fill="currentColor"/><circle cx="16.5" cy="15" r="1" fill="currentColor"/></svg>`,
        map: `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m9 18-6 3V6l6-3m0 15 6 3m-6-3V3m6 18 6-3V3l-6 3m0 15V6m0 0L9 3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
        weather: `<svg class="driver-meta-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 17h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.3 10.5 3.5 3.5 0 0 0 7 17Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 21h.01M12 21h.01M16 21h.01" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>`,
      };
      return icons[name] || "";
    }

    function driverProfileCard(driver) {
      const summary = driverRouteSummary(driver);
      const timeLabel = routeTimeLabel(summary);
      return `
        <button class="driver-card" type="button" data-driver="${escapeHtml(driver.slug)}" aria-label="Open ${escapeHtml(driver.display_name)} profile">
          <span class="avatar small">${escapeHtml(driver.initials)}</span>
          <span class="driver-copy">
            <strong>${escapeHtml(driver.display_name)}</strong>
          </span>
          <span class="driver-action-group">
            <span class="pill">${escapeHtml(pickupCountLabel(driver.pickup_count))}</span>
            <span class="driver-chevron" aria-hidden="true">&rsaquo;</span>
          </span>
          <span class="driver-details">
            <span class="driver-route-row">${iconSvg("pin")}<span>${escapeHtml(summary.routeLabel)}</span></span>
            ${timeLabel ? `<span class="driver-route-row">${iconSvg("clock")}<span>${escapeHtml(timeLabel)}</span></span>` : ""}
          </span>
        </button>`;
    }

    function profileDestinationCard() {
      const destination = destinationSummary();
      return `
        <a class="profile-destination-card" href="${googleMaps(destination.address)}" target="_blank" rel="noreferrer">
          <span class="destination-icon">${iconSvg("pin")}</span>
          <span class="destination-copy">
            <strong>All routes end at<br>${escapeHtml(destination.label)}</strong>
            <p>${escapeHtml(destination.address)}</p>
          </span>
          <span class="destination-map-icon">${iconSvg("map")}</span>
        </a>`;
    }

    function cloneStops(stops = []) {
      return stops.map((stop) => ({ ...stop }));
    }

    function adminDrivers() {
      return state.admin?.drivers || [];
    }

    function adminStops() {
      return state.adminDraftStops || [];
    }

    function adminPeople() {
      return (state.admin?.people || []).filter((person) => person?.active !== false);
    }

    function adminPersonById(personId) {
      return adminPeople().find((person) => person.id === personId);
    }

    function adminPersonNameKey(person) {
      return String(person?.name || "").trim().toLowerCase().replace(/\s+/g, " ");
    }

    function adminPersonNamesCompatible(person, candidate) {
      const nameKey = adminPersonNameKey(person);
      const candidateNameKey = adminPersonNameKey(candidate);
      if (!nameKey || !candidateNameKey) return false;

      return (
        nameKey === candidateNameKey ||
        nameKey.startsWith(`${candidateNameKey} `) ||
        candidateNameKey.startsWith(`${nameKey} `)
      );
    }

    function adminPersonPhoneKey(person) {
      return String(person?.phone || "").replace(/\D/g, "");
    }

    function adminDuplicateCandidates(person) {
      if (!person) return [];
      const phoneKey = adminPersonPhoneKey(person);

      return adminPeople().filter((candidate) => {
        if (!candidate || candidate.id === person.id) return false;
        const candidatePhoneKey = adminPersonPhoneKey(candidate);

        return (
          adminPersonNamesCompatible(person, candidate) ||
          (phoneKey && candidatePhoneKey && phoneKey === candidatePhoneKey)
        );
      });
    }

    function adminPeopleStatus(person) {
      if (adminDuplicateCandidates(person).length) return "Possible duplicate";
      if (!String(person?.phone || "").trim() || !preferredPersonAddress(person)) return "Needs review";
      return "";
    }

    function preferredPersonAddress(person) {
      if (!person) return "";
      return person.preferredAddress || person.homeAddress || person.campusAddress || "";
    }

    function adminAddressOptionsForPerson(person) {
      if (!person) return [];
      const seen = new Set();
      return [
        { type: "campus", label: "Campus address", address: person.campusAddress || "" },
        { type: "home", label: "Home address", address: person.homeAddress || "" },
      ].filter((option) => {
        const key = option.address.trim().toLowerCase();
        if (!key || seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    }

    function adminSelectedPersonAddress(person) {
      const options = adminAddressOptionsForPerson(person);
      if (!options.length) return preferredPersonAddress(person);
      const selectedType = state.adminSelectedAddressType || person.preferredAddressType || options[0].type;
      return (options.find((option) => option.type === selectedType) || options[0]).address;
    }

    function adminRiderNameSuggestions() {
      const query = String(state.adminRiderQuery || "").trim().toLowerCase();
      if (!query) return [];
      return adminPeople()
        .filter((person) => String(person.name || "").toLowerCase().startsWith(query))
        .sort((a, b) => {
          const aName = String(a.name || "").toLowerCase();
          const bName = String(b.name || "").toLowerCase();
          return aName.localeCompare(bName);
        })
        .slice(0, 8);
    }

    function adminStopsForDriver(slug) {
      return orderedStops(adminStops().filter((stop) => stop.driverSlug === slug));
    }

    function adminRouteWarnings(driver, stops = [], timing = null) {
      const warnings = [];
      const add = (key, label, level = "normal", detail = {}) => {
        if (warnings.some((warning) => warning.key === key)) return;
        warnings.push({
          key,
          label,
          level,
          title: detail.title || label,
          detail: detail.detail || "",
          stopId: detail.stopId || "",
          actionLabel: detail.actionLabel || "",
        });
      };

      if (!stops.length) {
        add("no-riders", "No riders assigned", "normal", {
          title: "No riders assigned",
          detail: "Add riders before final route timing.",
        });
      }

      stops.forEach((stop, index) => {
        const riderName = String(stop.name || `Stop ${index + 1}`).trim();
        const stopKey = stop.id || `${driver?.slug || "route"}-${stop.stopOrder || index + 1}-${riderName}`;
        const action = stop.id ? { stopId: stop.id, actionLabel: "Fix rider" } : {};
        if (!String(stop.phone || "").trim()) {
          add(`missing-phone-${stopKey}`, "Missing number", "urgent", {
            title: `${riderName}: phone missing`,
            detail: "Add a number so admin can call or text if pickup changes.",
            ...action,
          });
        }
        if (!String(stop.pickupTime || "").trim()) {
          add(`missing-pickup-time-${stopKey}`, "Missing pickup time", "urgent", {
            title: `${riderName}: pickup time missing`,
            detail: "Add a pickup time before final route review.",
            ...action,
          });
        }
        if (!String(stop.address || "").trim()) {
          add(`missing-address-${stopKey}`, "Missing address", "urgent", {
            title: `${riderName}: pickup address missing`,
            detail: "Choose a home or campus pickup address.",
            ...action,
          });
        }
      });

      const timingStatus = timing?.status || "";
      if (timingStatus === "error" || (!timing && state.routeTimingStatus === "error")) {
        add("route-time-unavailable", "Route time unavailable", "normal", {
          title: "Route timing paused",
          detail: "Route time will update after rider data is fixed or live timing is available.",
        });
      }
      if (timingStatus === "loading" || (!timing && state.routeTimingStatus === "loading")) {
        add("route-time-loading", "Checking route time", "normal", {
          title: "Checking route time",
          detail: "Live timing is updating for this route.",
        });
      }
      if (timing?.warning) {
        add("route-warning", timing.warning, "urgent", {
          title: "Route timing needs review",
          detail: timing.warning,
        });
      }

      return warnings;
    }

    function adminRouteAttentionTitle(warnings) {
      if (!warnings.length) return "";
      const count = warnings.length;
      if (count === 1 && warnings[0].key === "route-time-loading") return "Checking route time";
      return `${count} ${count === 1 ? "thing needs" : "things need"} attention`;
    }

    function adminRouteAttentionDetail(warnings) {
      if (!warnings.length) return "";
      if (warnings.some((warning) => warning.level === "urgent")) return "Fix these before final route timing.";
      if (warnings.some((warning) => warning.key === "route-time-loading")) return "Live route time is updating.";
      if (warnings.some((warning) => warning.key === "route-time-unavailable")) return "Timing will update when live route time is available.";
      return "Review before Sunday.";
    }

    function adminRouteWarningSummaryHtml(driver, warnings, isOpen) {
      const urgent = warnings.some((warning) => warning.level === "urgent");
      return `
        <section class="admin-route-warning-summary ${urgent ? "urgent" : ""}" aria-label="${escapeHtml(driver.displayName)} route attention">
          <span class="admin-route-warning-copy">
            <strong>${escapeHtml(adminRouteAttentionTitle(warnings))}</strong>
            <span>${escapeHtml(adminRouteAttentionDetail(warnings))}</span>
          </span>
          ${isOpen ? "" : `<button class="admin-chip-button" type="button" data-admin-driver-toggle="${escapeHtml(driver.slug)}">Review</button>`}
        </section>`;
    }

    function adminRouteWarningItemHtml(warning) {
      const urgent = warning.level === "urgent";
      return `
        <article class="admin-warning-item">
          <span class="admin-warning-icon ${urgent ? "urgent" : ""}" aria-hidden="true">${urgent ? "!" : "i"}</span>
          <span class="admin-warning-copy">
            <strong>${escapeHtml(warning.title)}</strong>
            ${warning.detail ? `<span>${escapeHtml(warning.detail)}</span>` : ""}
          </span>
          ${warning.stopId ? `<button class="admin-chip-button" type="button" data-admin-edit="${escapeHtml(warning.stopId)}">${escapeHtml(warning.actionLabel || "Fix rider")}</button>` : ""}
        </article>`;
    }

    function adminRouteWarningsHtml(driver, stops, options = {}) {
      const warnings = adminRouteWarnings(driver, stops, routeTimingForDriver(driver.slug));
      if (!warnings.length) return "";
      return `
        ${adminRouteWarningSummaryHtml(driver, warnings, Boolean(options.isOpen))}
        ${options.isOpen ? `
        <div class="admin-warning-list" aria-label="${escapeHtml(driver.displayName)} route warnings">
          ${warnings.map(adminRouteWarningItemHtml).join("")}
        </div>` : ""}`;
    }

    function adminDriverBySlug(slug) {
      return adminDrivers().find((driver) => driver.slug === slug);
    }

    function adminDriverName(slug) {
      return adminDriverBySlug(slug)?.displayName || slug || "Unassigned";
    }

    function adminDriverPickupCount(driver) {
      return Number(driver?.pickupCount ?? driver?.pickup_count ?? 0);
    }

    function adminOriginalStopMap() {
      return new Map((state.admin?.stops || []).map((stop) => [stop.id, stop]));
    }

    function adminComparableStop(stop) {
      return {
        id: String(stop.id || ""),
        driverSlug: stop.driverSlug || "",
        stopOrder: Number(stop.stopOrder || 0),
        name: stop.name || "",
        phone: stop.phone || "",
        address: stop.address || "",
        area: stop.area || "",
        pickupTime: stop.pickupTime || "",
        readyBy: stop.readyBy || "",
        routeLabel: stop.routeLabel || "",
        notes: stop.notes || "",
      };
    }

    function adminChangedCount() {
      return adminChangeList().length;
    }

    function adminChangeList() {
      const original = adminOriginalStopMap();
      const changes = [];

      state.adminDeletedStopIds.forEach((stopId) => {
        const before = original.get(stopId);
        changes.push({
          symbol: "-",
          title: `Removed ${before?.name || "rider"} from ${adminDriverName(before?.driverSlug)}`,
          detail: before?.address || "This rider will be removed from the published plan.",
        });
      });

      adminStops().forEach((stop) => {
        const stopId = String(stop.id || "");
        const before = original.get(stop.id);

        if (stopId.startsWith("temp-") || !before) {
          changes.push({
            symbol: "+",
            title: `Added ${stop.name} to ${adminDriverName(stop.driverSlug)}`,
            detail: stop.address || "New rider needs an address before publishing.",
          });
          return;
        }

        const beforeComparable = adminComparableStop(before);
        const afterComparable = adminComparableStop(stop);
        if (JSON.stringify(beforeComparable) === JSON.stringify(afterComparable)) return;

        const details = [];
        if (before.driverSlug !== stop.driverSlug) {
          details.push(`${adminDriverName(before.driverSlug)} to ${adminDriverName(stop.driverSlug)}`);
        }
        if (before.name !== stop.name) details.push(`Name changed from ${before.name}`);
        if (before.address !== stop.address) details.push("Address updated");
        if (before.phone !== stop.phone) details.push("Phone updated");
        if (before.pickupTime !== stop.pickupTime || before.readyBy !== stop.readyBy) details.push("Pickup time updated");
        if (Number(before.stopOrder || 0) !== Number(stop.stopOrder || 0)) details.push("Stop order updated");
        if (before.area !== stop.area) details.push("Area updated");
        if (before.routeLabel !== stop.routeLabel) details.push("Route label updated");
        if (before.notes !== stop.notes) details.push("Notes updated");

        changes.push({
          symbol: before.driverSlug !== stop.driverSlug ? ">" : "*",
          title: before.driverSlug !== stop.driverSlug
            ? `${stop.name} moved from ${adminDriverName(before.driverSlug)} to ${adminDriverName(stop.driverSlug)}`
            : `${stop.name} details updated`,
          detail: details.join(" · ") || "Rider details changed.",
        });
      });

      return changes;
    }

    function adminSearchText(stop) {
      return [
        stop.name,
        stop.phone,
        stop.address,
        stop.area,
        stop.pickupTime,
        stop.readyBy,
        stop.routeLabel,
        adminDriverName(stop.driverSlug),
      ].filter(Boolean).join(" ").toLowerCase();
    }

    function adminFilteredStops() {
      const query = String(state.adminSearch || "").trim().toLowerCase();
      const stops = adminStops()
        .slice()
        .sort((a, b) => adminDriverName(a.driverSlug).localeCompare(adminDriverName(b.driverSlug)) || Number(a.stopOrder || 0) - Number(b.stopOrder || 0) || a.name.localeCompare(b.name));

      if (!query) return stops;
      return stops.filter((stop) => adminSearchText(stop).includes(query));
    }

    function adminPeopleSearchText(person) {
      return [
        person.name,
        person.phone,
        person.campusAddress,
        person.homeAddress,
        person.preferredAddress,
        person.notes,
      ].filter(Boolean).join(" ").toLowerCase();
    }

    function adminFilteredPeople() {
      const query = String(state.adminPeopleSearch || "").trim().toLowerCase();
      const people = adminPeople()
        .slice()
        .sort((a, b) => a.name.localeCompare(b.name));

      if (!query) return people;
      return people.filter((person) => adminPeopleSearchText(person).includes(query));
    }

    function normalizeAdminDraftStops() {
      const byDriver = new Map();
      adminStops().forEach((stop) => {
        const list = byDriver.get(stop.driverSlug) || [];
        list.push(stop);
        byDriver.set(stop.driverSlug, list);
      });

      byDriver.forEach((list) => {
        list
          .sort((a, b) => Number(a.stopOrder || 0) - Number(b.stopOrder || 0) || a.name.localeCompare(b.name))
          .forEach((stop, index) => {
            stop.stopOrder = index + 1;
          });
      });
    }

    function adminDriverOptionList(selectedSlug) {
      return adminDrivers().map((driver) => `
        <option value="${escapeHtml(driver.slug)}" ${driver.slug === selectedSlug ? "selected" : ""}>${escapeHtml(driver.displayName)}</option>
      `).join("");
    }

    function openAdminEditor(stopId = "new", mode = "edit") {
      state.adminSelectedStopId = stopId;
      state.adminPersonSeed = null;
      state.adminRiderQuery = "";
      state.adminSelectedAddressType = "";
      state.adminEditMode = mode;
      state.adminError = "";
      state.adminMessage = "";
      state.view = "adminEdit";
      render();
    }

    function openAdminPersonEditor(personId) {
      const person = adminPersonById(personId);
      if (!person) return;

      state.adminSelectedStopId = "new";
      state.adminPersonSeed = person;
      state.adminRiderQuery = person.name || "";
      state.adminSelectedAddressType = person.preferredAddressType || adminAddressOptionsForPerson(person)[0]?.type || "";
      state.adminEditMode = "add";
      state.adminError = "";
      state.adminMessage = "";
      state.view = "adminEdit";
      render();
    }

    function openAdminPersonDetail(personId) {
      const person = adminPersonById(personId);
      if (!person) return;

      state.adminSelectedPersonId = personId;
      state.adminPersonDraft = null;
      state.adminPersonReviewMode = "";
      state.adminMergePrimaryId = "";
      state.adminMergeDuplicateId = "";
      state.adminMergeDraft = null;
      state.adminError = "";
      state.adminMessage = "";
      state.view = "adminPersonDetail";
      render();
    }

    function adminPersonEditable(person) {
      return {
        id: person?.id || "",
        name: person?.name || "",
        phone: person?.phone || "",
        campusAddress: person?.campusAddress || "",
        homeAddress: person?.homeAddress || "",
        preferredAddressType: person?.preferredAddressType === "campus" ? "campus" : "home",
        sourceLabel: person?.sourceLabel || "PeopleData",
        notes: person?.notes || "",
      };
    }

    function adminPersonDraftFromForm(form) {
      const formData = new FormData(form);
      const preferredAddressType = String(formData.get("preferredAddressType") || "home");
      return {
        id: String(formData.get("id") || ""),
        name: String(formData.get("name") || "").trim(),
        phone: String(formData.get("phone") || "").trim(),
        campusAddress: String(formData.get("campusAddress") || "").trim(),
        homeAddress: String(formData.get("homeAddress") || "").trim(),
        preferredAddressType: preferredAddressType === "campus" ? "campus" : "home",
        sourceLabel: adminPersonById(state.adminSelectedPersonId)?.sourceLabel || "PeopleData",
        notes: String(formData.get("notes") || "").trim(),
      };
    }

    function openAdminPersonEdit(personId) {
      const person = adminPersonById(personId);
      if (!person) return;

      state.adminSelectedPersonId = personId;
      state.adminPersonDraft = adminPersonEditable(person);
      state.adminPersonReviewMode = "";
      state.adminError = "";
      state.view = "adminPersonEdit";
      render();
    }

    function adminPersonChangeList() {
      const before = adminPersonEditable(adminPersonById(state.adminSelectedPersonId));
      const after = state.adminPersonDraft;
      if (!after) return [];

      const changes = [];
      if (before.name !== after.name) changes.push(`Name changed from ${before.name} to ${after.name}`);
      if (before.phone !== after.phone) changes.push("Phone updated");
      if (before.campusAddress !== after.campusAddress) changes.push("Campus address updated");
      if (before.homeAddress !== after.homeAddress) changes.push("Home address updated");
      if (before.preferredAddressType !== after.preferredAddressType) {
        changes.push(`Primary address changed to ${after.preferredAddressType === "campus" ? "Campus" : "Home"}`);
      }
      if (before.notes !== after.notes) changes.push("Notes updated");
      return changes;
    }

    function adminMergePeoplePair() {
      const selected = adminPersonById(state.adminSelectedPersonId);
      const explicitDuplicate = adminPersonById(state.adminMergeDuplicateId);
      const duplicate = explicitDuplicate && explicitDuplicate.id !== selected?.id
        ? explicitDuplicate
        : adminDuplicateCandidates(selected)[0];
      return [selected, duplicate].filter(Boolean);
    }

    function adminMergedPerson(primary, duplicate) {
      const primaryDraft = adminPersonEditable(primary);
      const duplicateDraft = adminPersonEditable(duplicate);
      const duplicateNote = duplicateDraft.notes ? `Merged duplicate: ${duplicateDraft.notes}` : "Merged duplicate record.";
      return {
        ...primaryDraft,
        phone: primaryDraft.phone || duplicateDraft.phone,
        campusAddress: primaryDraft.campusAddress || duplicateDraft.campusAddress,
        homeAddress: primaryDraft.homeAddress || duplicateDraft.homeAddress,
        notes: [primaryDraft.notes, duplicateNote].filter(Boolean).join(" "),
      };
    }

    function adminMergeDraft() {
      const primary = adminPersonById(state.adminMergePrimaryId);
      const pair = adminMergePeoplePair();
      const duplicate = pair.find((person) => person.id !== primary?.id);
      if (!primary || !duplicate || primary.id === duplicate.id) return null;
      return {
        primaryId: primary.id,
        duplicateId: duplicate.id,
        primary,
        duplicate,
        finalPerson: adminMergedPerson(primary, duplicate),
      };
    }

    function openAdminPersonMerge(duplicateId) {
      const selected = adminPersonById(state.adminSelectedPersonId);
      const duplicate = adminPersonById(duplicateId);
      if (!selected || !duplicate || selected.id === duplicate.id) return;

      const selectedWeight = [selected.phone, selected.homeAddress, selected.campusAddress].filter(Boolean).length;
      const duplicateWeight = [duplicate.phone, duplicate.homeAddress, duplicate.campusAddress].filter(Boolean).length;
      const selectedIsPrimary = selectedWeight >= duplicateWeight;
      state.adminMergePrimaryId = selectedIsPrimary ? selected.id : duplicate.id;
      state.adminMergeDuplicateId = selectedIsPrimary ? duplicate.id : selected.id;
      state.adminError = "";
      state.view = "adminPersonMerge";
      render();
    }

    function adminSelectedStop() {
      if (state.adminSelectedStopId === "new") {
        const seed = state.adminPersonSeed;
        const preferredAddress = adminSelectedPersonAddress(seed);
        return {
          id: "",
          driverSlug: adminDrivers()[0]?.slug || "",
          stopOrder: 1,
          name: seed?.name || state.adminRiderQuery || "",
          phone: seed?.phone || "",
          address: preferredAddress,
          area: seed ? (state.adminSelectedAddressType === "campus" ? "Campus" : "Home") : "",
          pickupTime: "",
          readyBy: "",
          routeLabel: "",
          notes: "",
        };
      }

      return adminStops().find((stop) => stop.id === state.adminSelectedStopId);
    }

    function saveAdminDraftFromForm(form) {
      const formData = new FormData(form);
      const stop = {
        id: formData.get("id") || `temp-${Date.now()}`,
        driverSlug: String(formData.get("driverSlug") || ""),
        stopOrder: Number(formData.get("stopOrder") || 1),
        name: String(formData.get("name") || "").trim(),
        phone: String(formData.get("phone") || "").trim(),
        address: String(formData.get("addressChoice") || formData.get("address") || "").trim(),
        area: String(formData.get("area") || "").trim(),
        pickupTime: String(formData.get("pickupTime") || "").trim(),
        readyBy: String(formData.get("readyBy") || "").trim(),
        routeLabel: String(formData.get("routeLabel") || "").trim(),
        notes: String(formData.get("notes") || "").trim(),
      };

      if (!stop.name || !stop.address || !stop.driverSlug) {
        state.adminError = "Name, address, and driver are required.";
        render();
        return;
      }

      const index = state.adminDraftStops.findIndex((item) => item.id === stop.id);
      if (index >= 0) state.adminDraftStops[index] = stop;
      else state.adminDraftStops.push(stop);

      normalizeAdminDraftStops();
      state.adminSelectedStopId = null;
      state.adminPersonSeed = null;
      state.adminRiderQuery = "";
      state.adminSelectedAddressType = "";
      state.adminEditMode = "edit";
      state.adminMessage = `${stop.name} is ready to publish.`;
      state.adminError = "";
      state.adminActiveTab = "routes";
      state.view = "admin";
      render();
      loadAdminRouteTiming();
    }

    function deleteAdminDraftStop(stopId) {
      const stop = adminStops().find((item) => item.id === stopId);
      if (!stop) return;

      state.adminDraftStops = adminStops().filter((item) => item.id !== stopId);
      if (!String(stopId).startsWith("temp-")) {
        if (!state.adminDeletedStopIds.includes(stopId)) state.adminDeletedStopIds.push(stopId);
      }
      normalizeAdminDraftStops();
      state.adminSelectedStopId = null;
      state.adminPersonSeed = null;
      state.adminRiderQuery = "";
      state.adminSelectedAddressType = "";
      state.adminEditMode = "edit";
      state.adminMessage = `${stop.name} will be removed when you publish.`;
      state.adminError = "";
      state.adminActiveTab = "routes";
      state.view = "admin";
      render();
      loadAdminRouteTiming();
    }

    async function loadAdminSnapshot(adminCode = state.adminCode) {
      state.adminLoading = true;
      state.adminError = "";
      render();

      try {
        const snapshot = await rpc("ride_admin_snapshot", {
          p_admin_code: adminCode,
          p_plan_date: activePlanDate(),
        }, adminRpcOptions());

        if (!snapshot?.ok) {
          throw new Error(snapshot?.error || "invalid_admin_code");
        }

        const security = await loadAdminSecurityContext(adminCode);
        state.adminCode = adminCode;
        state.planDate = snapshot.plan?.date || activePlanDate();
        state.plan = snapshot.plan || state.plan;
        state.destination = snapshot.destination || state.destination;
        state.admin = { ...snapshot, security: snapshot.security || security };
        await loadAdminActivity();
        state.adminDraftStops = cloneStops(snapshot.stops);
        state.adminDeletedStopIds = [];
        state.adminSelectedStopId = null;
        state.adminPersonSeed = null;
        state.adminRiderQuery = "";
        state.adminSelectedAddressType = "";
        state.adminEditMode = "edit";
        state.adminActiveTab = "routes";
        state.adminSearch = "";
        state.adminPeopleSearch = "";
        state.adminExpandedDriverSlug = "";
        state.adminMessage = "";
        state.view = "admin";
        closeCodeModal();
        loadAdminRouteTiming();
      } catch (error) {
        state.adminError = error.message === "invalid_admin_code"
          ? (state.adminSession?.access_token && !adminCode ? "This login is not approved for ride admin." : "Admin code did not match.")
          : "Admin could not open.";
        if (state.codeMode === "admin" && codeModal.classList.contains("open")) {
          codeError.textContent = state.adminError;
          codeError.hidden = false;
        }
        console.error(error);
      } finally {
        state.adminLoading = false;
        render();
      }
    }

    async function publishAdminDraft() {
      if (!state.adminCode && !state.adminSession?.access_token) return;
      state.adminLoading = true;
      state.adminError = "";
      render();

      try {
        const published = await rpc("ride_admin_publish_plan", {
          p_admin_code: state.adminCode,
          p_plan_date: activePlanDate(),
          p_stops: adminStops().map((stop) => ({
            ...stop,
            id: String(stop.id || "").startsWith("temp-") ? null : stop.id,
          })),
          p_deleted_stop_ids: state.adminDeletedStopIds,
        }, adminRpcOptions());

        if (!published?.ok) {
          throw new Error(published?.error || "publish_failed");
        }

        state.admin = published;
        state.planDate = published.plan?.date || activePlanDate();
        state.plan = published.plan || state.plan;
        state.destination = published.destination || state.destination;
        state.adminDraftStops = cloneStops(published.stops);
        state.adminDeletedStopIds = [];
        state.adminSelectedStopId = null;
        state.adminPersonSeed = null;
        state.adminRiderQuery = "";
        state.adminSelectedAddressType = "";
        state.adminEditMode = "edit";
        state.adminActiveTab = "routes";
        state.adminSearch = "";
        state.adminPeopleSearch = "";
        state.adminExpandedDriverSlug = "";
        state.adminMessage = "Route changes published.";
        await loadAdminActivity();
        state.view = "admin";
        state.drivers = await rpc("ride_driver_directory", { p_plan_date: activePlanDate() });
        loadAdminRouteTiming();
      } catch (error) {
        state.adminError = "Could not publish changes.";
        console.error(error);
      } finally {
        state.adminLoading = false;
        render();
      }
    }

    function openAdminReset() {
      state.adminResetDate = nextSundayDate();
      state.adminResetDriverSlugs = adminDrivers().map((driver) => driver.slug);
      state.adminMessage = "";
      state.adminError = "";
      state.view = "adminReset";
      render();
    }

    async function startNewSundayFromForm(form) {
      if (!state.adminCode && !state.adminSession?.access_token) return;
      const formData = new FormData(form);
      const planDate = String(formData.get("planDate") || "").trim();
      const driverSlugs = formData.getAll("driverSlug").map(String).filter(Boolean);

      if (!planDate) {
        state.adminError = "Choose the new Sunday date.";
        render();
        return;
      }

      if (!driverSlugs.length) {
        state.adminError = "Choose at least one driver.";
        render();
        return;
      }

      state.adminLoading = true;
      state.adminError = "";
      render();

      try {
        const created = await rpc("ride_admin_start_new_sunday", {
          p_admin_code: state.adminCode,
          p_plan_date: planDate,
          p_driver_slugs: driverSlugs,
          p_source_plan_date: activePlanDate(),
          p_make_active: true,
        }, adminRpcOptions());

        if (!created?.ok) {
          throw new Error(created?.error || "reset_failed");
        }

        state.planDate = created.plan?.date || planDate;
        state.plan = created.plan || null;
        state.destination = created.destination || state.destination;
        state.admin = created;
        await loadAdminActivity();
        state.adminDraftStops = cloneStops(created.stops);
        state.adminDeletedStopIds = [];
        state.adminSelectedStopId = null;
        state.adminPersonSeed = null;
        state.adminRiderQuery = "";
        state.adminSelectedAddressType = "";
        state.adminEditMode = "edit";
        state.adminActiveTab = "routes";
        state.adminSearch = "";
        state.adminPeopleSearch = "";
        state.adminExpandedDriverSlug = "";
        state.adminResetDate = "";
        state.adminResetDriverSlugs = [];
        state.adminMessage = `New Sunday created for ${planDateLabel(state.planDate)}. Routes are blank.`;
        state.view = "admin";
        state.drivers = await rpc("ride_driver_directory", { p_plan_date: activePlanDate() });
        loadAdminRouteTiming();
      } catch (error) {
        state.adminError = error.message === "sunday_date_required"
          ? "Choose a Sunday date."
          : "Could not start the new Sunday.";
        console.error(error);
      } finally {
        state.adminLoading = false;
        render();
      }
    }

    async function saveAdminPersonDraft() {
      if (!state.adminPersonDraft) return;
      state.adminLoading = true;
      state.adminError = "";
      render();

      try {
        const saved = await rpc("ride_admin_upsert_people", {
          p_admin_code: state.adminCode,
          p_people: [state.adminPersonDraft],
          p_source_label: state.adminPersonDraft.sourceLabel || "PeopleData",
        }, adminRpcOptions());

        if (!saved?.ok) {
          throw new Error(saved?.error || "people_save_failed");
        }

        const savedName = state.adminPersonDraft.name;
        await loadAdminSnapshot(state.adminCode);
        state.adminActiveTab = "people";
        state.adminPeopleSearch = savedName;
        state.adminMessage = `${savedName} saved.`;
        state.view = "admin";
      } catch (error) {
        state.adminError = "Could not save this person.";
        console.error(error);
      } finally {
        state.adminLoading = false;
        render();
      }
    }

    async function saveAdminPersonMerge() {
      const draft = adminMergeDraft();
      if (!draft) {
        state.adminError = "Choose the primary person before merging.";
        render();
        return;
      }

      state.adminLoading = true;
      state.adminError = "";
      render();

      try {
        const merged = await rpc("ride_admin_merge_people", {
          p_admin_code: state.adminCode,
          p_primary_person_id: draft.primaryId,
          p_duplicate_person_id: draft.duplicateId,
          p_primary_person: draft.finalPerson,
        }, adminRpcOptions());

        if (!merged?.ok) {
          throw new Error(merged?.error || "people_merge_failed");
        }

        const mergedName = draft.finalPerson.name;
        await loadAdminSnapshot(state.adminCode);
        state.adminActiveTab = "people";
        state.adminPeopleSearch = mergedName;
        state.adminMessage = `${mergedName} merged.`;
        state.view = "admin";
      } catch (error) {
        state.adminError = "Could not merge these people.";
        console.error(error);
      } finally {
        state.adminLoading = false;
        render();
      }
    }

    async function saveAdminPersonArchive() {
      const person = adminPersonById(state.adminSelectedPersonId);
      if (!person) return;
      state.adminLoading = true;
      state.adminError = "";
      render();

      try {
        const archived = await rpc("ride_admin_archive_people", {
          p_admin_code: state.adminCode,
          p_person_id: person.id,
        }, adminRpcOptions());

        if (!archived?.ok) {
          throw new Error(archived?.error || "people_archive_failed");
        }

        const archivedName = person.name || "Person";
        await loadAdminSnapshot(state.adminCode);
        state.adminActiveTab = "people";
        state.adminPeopleSearch = "";
        state.adminSelectedPersonId = null;
        state.adminPersonDraft = null;
        state.adminPersonReviewMode = "";
        state.adminMessage = `${archivedName} archived.`;
        state.view = "admin";
      } catch (error) {
        state.adminError = "Could not archive this person.";
        console.error(error);
      } finally {
        state.adminLoading = false;
        render();
      }
    }

      if (names.length === 2) return names.join(" and ");
      return `${names.slice(0, -1).join(", ")}, and ${names.at(-1)}`;
    }

    }

    function routeTarget(riders, destination) {
      const nextRider = riders.find((rider) => !getPicked(rider.stopOrder));
      if (nextRider) {
        return {
          address: nextRider.address,
          label: `Start route to ${nextRider.name}`,
          allPicked: false,
        };
      }

      return {
        address: destination.address,
        label: `Start route to ${destination.label}`,
        allPicked: true,
      };
    }

    function ridesView() {
      const driver = state.route?.driver;
      const riders = state.route?.riders || [];
      const destination = state.route?.destination;
      const target = routeTarget(riders, destination);

      const cards = riders.map(routeStopRow).join("");

      return `
        <div class="stack">
          <section class="intro-block compact">
            <div class="title-row">
              <button class="back-button" type="button" data-action="driverHome" aria-label="Back">&larr;</button>
              <div>
                <h1>Review route</h1>
                <p>${escapeHtml(driver.displayName)}'s pickups</p>
              </div>
            </div>
            ${routeScene(driver.slug, "review")}
          </section>

          <section class="route-list" aria-label="Assigned riders">
            <h2>Pick-up</h2>
            ${cards}
          </section>

          <section class="route-list" aria-label="Drop off">
            <h2>Drop-off</h2>
            <div class="route-stop destination ${target.allPicked ? "is-picked" : ""}">
              <span class="stop-number">✓</span>
              <span class="stop-copy">
                <strong>${escapeHtml(destination.label)}</strong>
                <span>${escapeHtml(destination.address)}</span>
                <small>${target.allPicked ? "Ready for final route" : "Final destination"}</small>
              </span>
            </div>
          </section>

          ${target.allPicked ? `
          <section class="route-complete-card" aria-label="All pickups complete">
            <span class="stop-number">✓</span>
            <span>
              <strong>All pickups complete</strong>
              <span>Start the final route to ${escapeHtml(destination.label)}.</span>
            </span>
          </section>` : ""}

          <a class="primary-action route-start" href="${googleMaps(target.address)}" target="_blank" rel="noreferrer">${escapeHtml(target.label)} <span aria-hidden="true">&rarr;</span></a>
        </div>`;
    }

    function detailRows(rider) {
      return [
        `<div class="detail-row"><small>Address</small><strong>${escapeHtml(rider.address)}</strong></div>`,
        rider.phone ? `<div class="detail-row"><small>Phone</small><strong>${escapeHtml(rider.phone)}</strong></div>` : "",
        rider.routeLabel ? `<div class="detail-row"><small>Route</small><strong>${escapeHtml(rider.routeLabel)}</strong></div>` : "",
        rider.pickupTime ? `<div class="detail-row"><small>Pickup time</small><strong>${escapeHtml(rider.pickupTime)}</strong></div>` : "",
        rider.readyBy ? `<div class="detail-row"><small>Ready by</small><strong>${escapeHtml(rider.readyBy)}</strong></div>` : "",
        `<div class="detail-row"><small>Notes</small><strong>${escapeHtml(rider.notes || "Coordinate pickup directly.")}</strong></div>`,
      ].join("");
    }

    function detailView() {
      const rider = state.selectedRider;
      const driver = state.route?.driver;
      const picked = getPicked(rider.stopOrder);
      const phoneLink = telHref(rider.phone);
      const messageLink = smsHref(rider.phone);

      return `
        <div class="stack">
          <section class="intro-block compact">
            <div class="title-row">
              <button class="back-button" type="button" data-action="rides" aria-label="Back">&larr;</button>
              <div>
                <h1>Pickup details</h1>
                <p>${escapeHtml(rider.area)}</p>
              </div>
            </div>
            ${routeScene(driver.slug, "review")}
          </section>

          <section class="person-banner">
            <span class="avatar small">${escapeHtml(rider.name.slice(0, 1))}</span>
            <div>
              <h2>${escapeHtml(rider.name)}</h2>
              <p>${escapeHtml(rider.address)}</p>
            </div>
            <span class="stop-number">${Number(rider.stopOrder)}</span>
          </section>
          <section class="detail-card">
            ${detailRows(rider)}
          </section>

          <a class="primary-action" href="${googleMaps(rider.address)}" target="_blank" rel="noreferrer">
            <span>Open in Google Maps</span>
          </a>
          <a class="secondary-action" href="${appleMaps(rider.address)}" target="_blank" rel="noreferrer">
            <span>Open in Apple Maps</span>
          </a>
          ${phoneLink ? `
          <section class="contact-actions" aria-label="Contact rider">
            <a class="secondary-action" href="${messageLink}">Message</a>
            <a class="secondary-action" href="${phoneLink}">Call</a>
          </section>` : ""}
          <button class="mark-button ${picked ? "is-picked" : ""}" type="button" data-mark="${Number(rider.stopOrder)}">
            <span>✓</span>
            <span>${picked ? "Picked up" : "Mark picked up"}</span>
          </button>
        </div>`;
    }

    function getStorageKey(stopOrder) {
      const driver = state.route?.driver?.slug || "driver";
      return "ride-picked-" + activePlanDate() + "-" + driver + "-" + stopOrder;
    }

    function getPicked(stopOrder) {
      return localStorage.getItem(getStorageKey(stopOrder)) === "1";
    }

    function setPicked(stopOrder, value) {
      localStorage.setItem(getStorageKey(stopOrder), value ? "1" : "0");
      render();
    }

    function markPickedAndReturn(stopOrder) {
      localStorage.setItem(getStorageKey(stopOrder), !getPicked(stopOrder) ? "1" : "0");
      state.selectedRider = null;
      state.view = "rides";
      render();
    }

    function render() {
      setActiveNav();
      if (state.view === "profile") screen.innerHTML = profileView();
      else if (state.view === "driverHome" && state.route) screen.innerHTML = driverHomeView();
      else if (state.view === "rides" && state.route) screen.innerHTML = ridesView();
      else if (state.view === "detail" && state.selectedRider) screen.innerHTML = detailView();
      else if (state.view === "admin") screen.innerHTML = adminView();
      else if (state.view === "adminReview") screen.innerHTML = adminReviewView();
      else if (state.view === "adminPersonDetail") screen.innerHTML = adminPersonDetailView();
      else if (state.view === "adminPersonEdit") screen.innerHTML = adminPersonEditView();
      else if (state.view === "adminPersonReview") screen.innerHTML = adminPersonReviewView();
      else if (state.view === "adminPersonMerge") screen.innerHTML = adminPersonMergeView();
      else if (state.view === "adminEdit") screen.innerHTML = adminEditView();
      else if (state.view === "adminReset") screen.innerHTML = adminResetView();
      else screen.innerHTML = homeView();
      syncPickedChips();
    }

    function syncPickedChips() {
      document.querySelectorAll(".rider-card[data-rider], .route-stop[data-rider]").forEach((card) => {
        const stopOrder = card.dataset.rider;
        card.classList.toggle("is-picked", getPicked(stopOrder));
      });
    }

    async function openCodeModal(slug) {
      state.codeMode = "driver";
      state.adminLoginMode = "code";
      state.selectedDriver = state.drivers.find((driver) => driver.slug === slug);
      document.querySelector("#modalTitle").textContent = "Passcode";
      modalDriver.textContent = state.selectedDriver?.display_name || "";
      codeSubmit.textContent = "Open route";
      adminAuthFields.hidden = true;
      driverCode.hidden = false;
      codeError.hidden = true;
      codeError.textContent = "";
      driverCode.value = "";
      adminEmail.value = "";
      adminPassword.value = "";
      codeModal.classList.add("open");
    }

    function openAdminCodeModal() {
      if (state.adminSession?.access_token) {
        state.codeMode = "admin";
        loadAdminSnapshot("");
        return;
      }
      state.codeMode = "admin";
      state.selectedDriver = null;
      state.adminLoginMode = "auth";
      document.querySelector("#modalTitle").textContent = "Admin sign in";
      modalDriver.textContent = "Ride Control";
      codeSubmit.textContent = "Sign in";
      adminAuthFields.hidden = false;
      driverCode.hidden = true;
      codeError.hidden = true;
      codeError.textContent = "";
      adminEmail.value = "";
      adminPassword.value = "";
      driverCode.value = "";
      codeModal.classList.add("open");
    }

    function setAdminCodeFallbackMode() {
      state.codeMode = "admin";
      state.adminLoginMode = "code";
      document.querySelector("#modalTitle").textContent = "Admin passcode";
      modalDriver.textContent = "Ride Control";
      codeSubmit.textContent = "Open admin";
      adminAuthFields.hidden = true;
      driverCode.hidden = false;
      codeError.hidden = true;
      codeError.textContent = "";
      driverCode.value = "";
      driverCode.focus();
    }

    function closeCodeModal() {
      codeModal.classList.remove("open");
      codeError.hidden = true;
      codeError.textContent = "";
    }

    async function submitCode(event) {
      event.preventDefault();
      if (state.codeMode === "admin") {
        try {
          if (state.adminLoginMode === "auth") {
            await signInAdminWithPassword(adminEmail.value.trim(), adminPassword.value);
          } else {
            await loadAdminSnapshot(driverCode.value);
          }
        } catch (error) {
          codeError.textContent = state.adminLoginMode === "auth" ? "Admin login could not open Ride Control." : "Admin could not open.";
          codeError.hidden = false;
          console.error(error);
        }
        return;
      }

      if (!state.selectedDriver) return;
      codeError.hidden = true;
      codeError.textContent = "";

      try {
        const route = await rpc("ride_driver_route", {
          p_driver_slug: state.selectedDriver.slug,
          p_access_code: driverCode.value,
          p_plan_date: activePlanDate(),
        });

        if (!route?.ok) {
          codeError.textContent = "Code did not match.";
          codeError.hidden = false;
          return;
        }

        state.route = route;
        state.weatherOpen = false;
        state.weatherStatus = "idle";
        state.weatherForecast = null;
        state.weatherDate = "";
        state.routeTimingStatus = "idle";
        state.routeTimingError = "";
        state.routeTimingPlanDate = "";
        state.routeTimings = {};
        closeCodeModal();
        setDriverHome();
        loadDriverRouteTiming(driverCode.value);
        loadWeatherForecast();
      } catch (error) {
        codeError.textContent = "Route could not open.";
        codeError.hidden = false;
        console.error(error);
      }
    }

    screen.addEventListener("click", (event) => {
      const adminTabButton = event.target.closest("[data-admin-tab]");
      if (adminTabButton) {
        state.adminActiveTab = adminTabButton.dataset.adminTab;
        render();
        return;
      }

      const adminDriverToggle = event.target.closest("[data-admin-driver-toggle]");
      if (adminDriverToggle) {
        const slug = adminDriverToggle.dataset.adminDriverToggle;
        state.adminExpandedDriverSlug = state.adminExpandedDriverSlug === slug ? "" : slug;
        render();
        return;
      }

      const action = event.target.closest("[data-action]")?.dataset.action;
      if (action === "home") openHome();
      if (action === "profile") openProfile();
      if (action === "driverHome") setDriverHome();
      if (action === "rides") setRidesView();
      if (action === "toggleWeather") {
        state.weatherOpen = !state.weatherOpen;
        if (state.weatherOpen && state.weatherStatus === "idle") loadWeatherForecast();
        render();
      }
      if (action === "admin") openAdminCodeModal();
      if (action === "adminSignOut") signOutAdmin();
      if (action === "adminBack") {
        state.adminError = "";
        state.adminSelectedStopId = null;
        state.adminPersonSeed = null;
        state.adminSelectedPersonId = null;
        state.adminPersonDraft = null;
        state.adminPersonReviewMode = "";
        state.adminMergePrimaryId = "";
        state.adminMergeDuplicateId = "";
        state.adminMergeDraft = null;
        state.adminEditMode = "edit";
        state.view = "admin";
        render();
      }
      if (action === "adminReset") openAdminReset();
      if (action === "adminReviewChanges") {
        state.view = "adminReview";
        render();
      }
      if (action === "adminPersonBack") {
        state.adminError = "";
        state.view = state.adminSelectedPersonId ? "adminPersonDetail" : "admin";
        render();
      }
      if (action === "adminPersonEditBack") {
        state.adminError = "";
        state.view = "adminPersonEdit";
        render();
      }
      if (action === "adminPersonConfirmSave") saveAdminPersonDraft();
      if (action === "adminPersonConfirmMerge") saveAdminPersonMerge();
      if (action === "adminPersonArchive") {
        state.adminPersonDraft = null;
        state.adminPersonReviewMode = "archive";
        state.adminError = "";
        state.view = "adminPersonReview";
        render();
      }
      if (action === "adminPersonConfirmArchive") saveAdminPersonArchive();
      if (action === "adminResetBack") {
        state.adminError = "";
        state.adminResetDate = "";
        state.adminResetDriverSlugs = [];
        state.view = "admin";
        render();
      }
      if (action === "adminNew") openAdminEditor("new");
      if (action === "adminPublish") publishAdminDraft();

      const adminEditButton = event.target.closest("[data-admin-edit]");
      if (adminEditButton) openAdminEditor(adminEditButton.dataset.adminEdit);

      const adminMoveButton = event.target.closest("[data-admin-move]");
      if (adminMoveButton) openAdminEditor(adminMoveButton.dataset.adminMove, "move");

      const adminPersonOpenButton = event.target.closest("[data-admin-person-open]");
      if (adminPersonOpenButton) {
        openAdminPersonDetail(adminPersonOpenButton.dataset.adminPersonOpen);
        return;
      }

      const adminPersonEditButton = event.target.closest("[data-admin-person-edit]");
      if (adminPersonEditButton) {
        openAdminPersonEdit(adminPersonEditButton.dataset.adminPersonEdit);
        return;
      }

      const adminPersonMergeButton = event.target.closest("[data-admin-person-merge]");
      if (adminPersonMergeButton) {
        openAdminPersonMerge(adminPersonMergeButton.dataset.adminPersonMerge);
        return;
      }

      const adminAddPersonButton = event.target.closest("[data-admin-add-person]");
      if (adminAddPersonButton) openAdminPersonEditor(adminAddPersonButton.dataset.adminAddPerson);

      const adminPersonSelectButton = event.target.closest("[data-admin-person-select]");
      if (adminPersonSelectButton) {
        const person = adminPersonById(adminPersonSelectButton.dataset.adminPersonSelect);
        if (person) {
          state.adminPersonSeed = person;
          state.adminRiderQuery = person.name || "";
          state.adminSelectedAddressType = person.preferredAddressType || adminAddressOptionsForPerson(person)[0]?.type || "";
          render();
        }
      }

      const adminNewRiderButton = event.target.closest("[data-admin-new-rider]");
      if (adminNewRiderButton) {
        state.adminPersonSeed = null;
        state.adminRiderQuery = adminNewRiderButton.dataset.adminNewRider || state.adminRiderQuery || "";
        state.adminSelectedAddressType = "";
        render();
      }

      const adminAddressOption = event.target.closest(".admin-address-option");
      if (adminAddressOption) {
        const input = adminAddressOption.querySelector("[data-admin-address-type]");
        if (input) {
          input.checked = true;
          state.adminSelectedAddressType = input.dataset.adminAddressType || "";
        }
      }

      const adminDeleteButton = event.target.closest("[data-admin-delete]");
      if (adminDeleteButton) {
        const stopId = adminDeleteButton.dataset.adminDelete;
        const stop = adminStops().find((item) => item.id === stopId);
        if (stop && confirm(`Remove ${stop.name} from the ride plan?`)) {
          deleteAdminDraftStop(stopId);
        }
      }

      const driverButton = event.target.closest("[data-driver]");
      if (driverButton) openCodeModal(driverButton.dataset.driver);

      const riderButton = event.target.closest("[data-rider]");
      if (riderButton) {
        const stopOrder = Number(riderButton.dataset.rider);
        state.selectedRider = (state.route?.riders || []).find((rider) => Number(rider.stopOrder) === stopOrder);
        if (state.selectedRider) {
          state.view = "detail";
          render();
        }
      }

      const markButton = event.target.closest("[data-mark]");
      if (markButton) {
        const stopOrder = markButton.dataset.mark;
        markPickedAndReturn(stopOrder);
      }
    });

    screen.addEventListener("input", (event) => {
      const resetForm = event.target.closest("[data-admin-form='reset']");
      if (resetForm) {
        if (event.target.name === "planDate") {
          state.adminResetDate = event.target.value;
        }
        if (event.target.name === "driverSlug") {
          const checked = [...resetForm.querySelectorAll("input[name='driverSlug']:checked")].map((input) => input.value);
          state.adminResetDriverSlugs = checked;
          render();
        }
        return;
      }

      const riderNameInput = event.target.closest("[data-admin-rider-name]");
      if (riderNameInput && state.adminSelectedStopId === "new") {
        state.adminRiderQuery = riderNameInput.value;
        state.adminPersonSeed = null;
        state.adminSelectedAddressType = "";
        const suggestions = screen.querySelector("[data-admin-person-suggestions]");
        if (suggestions) {
          const items = adminRiderSuggestionItemsHtml();
          suggestions.innerHTML = items;
          suggestions.hidden = !items;
        }
        return;
      }

      const peopleSearchInput = event.target.closest("[data-admin-people-search]");
      if (peopleSearchInput) {
        state.adminPeopleSearch = peopleSearchInput.value;
        const results = screen.querySelector("[data-admin-people-results]");
        if (results) results.innerHTML = adminPeopleResultsHtml({
          showData: state.adminActiveTab === "people",
        });
        return;
      }

      const mergePrimaryInput = event.target.closest("input[name='mergePrimary']");
      if (mergePrimaryInput) {
        const pair = adminMergePeoplePair();
        state.adminMergePrimaryId = mergePrimaryInput.value;
        state.adminMergeDuplicateId = pair.find((person) => person.id !== state.adminMergePrimaryId)?.id || "";
        render();
        return;
      }

      const searchInput = event.target.closest("[data-admin-search]");
      if (!searchInput) return;

      state.adminSearch = searchInput.value;
      const results = screen.querySelector("[data-admin-riders-results]");
      if (results) results.innerHTML = adminFilteredStops().map((stop) => adminRiderCard(stop, { showDriver: true })).join("");
    });

    screen.addEventListener("submit", (event) => {
      const resetForm = event.target.closest("[data-admin-form='reset']");
      if (resetForm) {
        event.preventDefault();
        startNewSundayFromForm(resetForm);
        return;
      }

      const adminForm = event.target.closest("[data-admin-form='rider']");
      if (adminForm) {
        event.preventDefault();
        saveAdminDraftFromForm(adminForm);
        return;
      }

      const personForm = event.target.closest("[data-admin-form='person']");
      if (personForm) {
        event.preventDefault();
        const draft = adminPersonDraftFromForm(personForm);
        if (!draft.name || (!draft.phone && !draft.campusAddress && !draft.homeAddress)) {
          state.adminError = "Name and at least one phone or address are required.";
          state.adminPersonDraft = draft;
          render();
          return;
        }

        state.adminPersonDraft = draft;
        state.adminPersonReviewMode = "edit";
        state.adminError = "";
        state.view = "adminPersonReview";
        render();
      }
    });

    homeNav.addEventListener("click", () => {
      if (state.route) setDriverHome();
      else openHome();
    });
    profileNav.addEventListener("click", openProfile);
    adminCodeFallback.addEventListener("click", setAdminCodeFallbackMode);
    codeForm.addEventListener("submit", submitCode);
    document.querySelector("#cancelCode").addEventListener("click", closeCodeModal);
    codeModal.addEventListener("click", (event) => {
      if (event.target === codeModal) closeCodeModal();
    });

    loadDrivers();
  </script>
</body>
</html>
